type: object
props:
    order:
        desc: Order when several layers are chosen in turn. Lowest first.
        type: integer
        unspec: 0
    origins:
        href: https://0vergrown.github.io/Handbook/docs/datapack/origins/layers/
        desc: The origins offered in this layer.
        type: list
        vals:
            or:
              - title: simple
                type: list
                vals:
                    link: identifier
              - title: conditioned
                type: list
                vals:
                    type: object
                    props:
                        condition:
                            desc: The condition that the player needs to fulfill to get access to the origins specified here. Client-side checks only!
                            id: powers
                            link: entity_condition
                        origins:
                            desc: IDs of the origins which should become available when the condition is fulfilled.
                            type: list
                            vals:
                                link: identifier
        required: true
    enabled:
        desc: Whether the layer is active.
        type: boolean
        unspec: true
    replace:
        desc: Discard lower-priority packs’ version of this layer instead of merging into it.
        type: boolean
    loading_priority:
        desc: Specifies when this power is loaded. Higher numbers mean it's loaded later, which means it will override those with lower loading priorities which share the same ID.
        type: integer
        gap: true
    name:
        desc: Translation key for the layer’s title.
        type: string
    gui_title:
        desc: Translation keys for the two screens.
        type: object
        props:
            choose_origin:
                desc: If specified, this will override the title that shows up when choosing an origin in the layer.
                type: string
            view_origin:
                desc: If specified, this will override the title that shows up when viewing an origin in the layer.
                type: string
        gap: true
    missing_name:
        desc: Translation key shown when the player has no origin in this layer.
        type: string
    missing_description:
        desc: Translation key for that placeholder’s description.
        type: string
        gap: true
    random:
        type: object
        props:
            allow:
                desc: Offer the “random” option in the screen.
                type: boolean
                unspec: true
            allow_unchoosable:
                desc: Let the roll land on unchoosable origins.
                type: boolean
            exclude:
                desc: Origins the roll never picks.
                type: list
                vals:
                    link: identifier
            style:
                enum:
                  - uniform
                  - weighted
                  - roll
                  - gacha
                more:
                    string-uniform: {}
                    string-weighted:
                        weights:
                            desc: Randomly chooses the origin based on a table of weighted origins.
                            type: list
                            vals:
                                link: weight_map
                    string-roll:
                        desc: |
                            An animated 'roll' or 'gacha' style random selection animation.
                        roll_duration:
                            desc: Animation length in ticks.
                            type: integer
                            default: 80
                    string-gacha:
                        desc: |
                            (ALIAS) An animated 'roll' or 'gacha' style random selection animation.
                        roll_duration:
                            desc: Animation length in ticks.
                            type: integer
                            default: 80
    allow_random:
        desc: (DEPRECATED) If set to true, this layer will show an option for choosing a random origin.
        type: boolean
    allow_random_unchoosable:
        title: Random Unchoosable
        desc: Whether origins which are unchoosable (unchoosable field set to true in the origin file) should be included in the random option. Can for example be used to force players to choose a random origin, by setting this to true and making all origins in the layer unchoosable.
        type: boolean
    exclude_random:
        desc: If specified, the origins included in this list will not be picked by the random choice.
        type: list
        vals:
            link: identifier
    default_origin:
        desc: Fallback for players this layer offers no choice to.
        link: identifier
    auto_choose:
        desc: Skip the screen when the layer offers exactly one choosable origin.
        type: boolean
    hidden:
        desc: Hide the layer from the origin-viewing screen.
        type: boolean
    revalidate:
        desc: Take the origin back when its group’s condition stops being true.
        link: boolean_optional
    swappable:
        desc: Make this layer a pool the player can temporarily swap their main origin for, rather than a layer they choose in — see Swappable layers.
        href: https://0vergrown.github.io/Handbook/docs/datapack/origins/swapping
        or:
          - title: simple
            type: boolean
          - title: advanced
            type: object
            props:
                target_layer:
                    desc: The layer whose origin gets replaced.
                    link: identifier
                shift_returns_to_main:
                    desc: Holding shift while pressing the swap key jumps straight back to the main origin.
                    type: boolean
                    unspec: true
                wrap_to_main:
                    desc: Cycling past the last option returns to the main origin rather than to the first option.
                    type: boolean
                    unspec: true
        gap: true
    randomiser:
        desc: Re-roll-over-a-life settings — see Lifecycle & re-rolls.
        href: https://0vergrown.github.io/Handbook/docs/datapack/origins/layers/#lifecycle--re-rolls
        type: object
        props:
            on_first_join:
                desc: Roll an origin when the player first joins.
                type: boolean
            on_death:
                desc: Re-roll on death.
                type: boolean
            on_sleep:
                desc: Re-roll after sleeping.
                type: boolean
            deaths_between_randomises:
                desc: Deaths required before a re-roll.
                type: integer
                default: 1
            sleeps_between_randomises:
                desc: Sleeps required before a re-roll.
                type: integer
                default: 1
            lives:
                desc: enabled (boolean, false) and starting (integer, 10) — lives before the layer locks.
                type: object
                props:
                    enabled:
                        type: boolean
                    starting:
                        type: integer
                        default: 10
            reset_to_default_on_death:
                desc: Revert to default_origin on death instead of re-rolling.
                type: boolean
            show_screen_on_death:
                desc: Open the choose screen on death rather than rolling.
                type: boolean
            allow_duplicate:
                desc: Let a re-roll land on the origin the player already had.
                type: boolean
            broadcast_messages:
                desc: Announce re-rolls in chat.
                type: boolean
                unspec: true
    max_players_per_origin:
        desc: Default player cap for every origin in this layer — see Capping a whole layer.
        href: https://0vergrown.github.io/Handbook/docs/datapack/origins/layers/#capping-a-whole-layer
        type: integer
        default: 0
links:
    identifier:
        type: string
        allow: '*a-z0-9_#\/:.-'
    boolean_optional:
        enum: ['default','true','false']
        unspec: 'default'
    weight_map:
        allowkey: '*a-z0-9_#\/:.-'
        type: integer
