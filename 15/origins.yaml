type: object
props:
    name:
        href: https://0vergrown.github.io/Handbook/docs/datapack/origins/overview/
        desc: The origin’s display name.
        type: string
    name_scroll_speed:
        desc: Speed a long name marquees at.
        type: integer
    description:
        desc: The lore shown when selecting.
        type: string
        ext: true
    powers:
        desc: The powers this origin grants.
        type: list
        large: true
        vals:
            link: identifier
    icon:
        desc: Shown in the selection screen. An item or a texture.
        id: powers
        link: item_stack
        gap: true
    upgrades:
        desc: Conditions that turn this origin into another one — see Upgrading into another origin.
        href: https://0vergrown.github.io/Handbook/docs/datapack/origins/overview/#upgrading-into-another-origin
        type: list
        vals:
            type: object
            props:
                condition:
                    desc: ID of an advancement which should trigger this upgrade.
                    id: powers
                    link: entity_condition
                    required: true
                origin:
                    desc: ID of an origin the origin with this upgrade should upgrade to.
                    link: identifier
                    required: true
                announcement:
                    desc: A text which will show up in the local chat of the player in a pretty color. If none is specified, there won't be a message.
                    id: powers
                    link: text_component
    unchoosable:
        desc: Exists but can’t be picked (e.g. an admin origin).
        type: boolean
    order:
        desc: Sort position in the screen.
        type: integer
        default: 0
    impact:
        desc: The “impact” dots — how strong the origin is.
        type: integer
        default: 0
        min: 0
        max: 3
    loading_priority:
        desc: Higher wins when packs define the same id.
        type: integer
        default: 0
    max_players:
        desc: How many players may hold this origin at once — see Capping an origin.
        href: https://0vergrown.github.io/Handbook/docs/datapack/origins/overview/#capping-an-origin
        type: integer
        min: -1
        default: -1
links:
    identifier:
    type: string
    allow: '*a-z0-9_#\/:.-'
