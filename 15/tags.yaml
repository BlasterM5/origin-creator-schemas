type: object
props:
    replace:
        type: boolean
    values:
        or:
          - title: simple
            large: true
            type: list
            vals:
                type: string
                allow: '*a-z0-9_#/:.-'
          - title: advanced
            aliases: [extra]
            type: list
            vals:
                nopanel: true
                or:
                  - title: simple
                    aliases: [string]
                    type: string
                    allow: '*a-z0-9_#/:.-'
                  - title: conditioned
                    aliases: [object]
                    type: object
                    props:
                        id:
                            type: string
                            allow: '*a-z0-9_#/:.-'
                        required:
                            type: boolean
                            default: true
