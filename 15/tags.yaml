type: object
props:
    replace:
        type: boolean
    values:
        or:
          - title: simple
            large: true
            type: list
            vals:
                type: string
                allow: '*a-z0-9_#/:.-'
          - title: advanced
            talias: extra
            type: list
            vals:
                nopanel: true
                or:
                  - title: simple
                    talias: string
                    type: string
                    allow: '*a-z0-9_#/:.-'
                  - title: conditioned
                    talias: object
                    type: object
                    props:
                        id:
                            type: string
                            allow: '*a-z0-9_#/:.-'
                        required:
                            type: boolean
                            default: true
