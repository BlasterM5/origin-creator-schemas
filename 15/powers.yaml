            link: entity_condition
        inverted:
            desc: If set to true, inverts the way the hud renders (full will look empty and vice versa)
            type: boolean
            default: false
        order:
            desc: If specified, this determines the position of the HUD render being rendered. The higher the 'order' value is, the higher it is on the rendered HUD render stack.
            type: integer
    icon:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/icon
        desc: An item, item stack, or texture, used wherever Apoli or Origins draws a small picture.\n Texture can be a single texture atlas, with the starting corner of a 16x16 region defined in width / height.\n If width / height are unspecified, it will use the whole texture and scale it to fit.
        icon:
            or:
              - title: item
                link: identifier
              - title: stack
                link: item_stack
              - title: texture
                type: object
                props:
                    texture:
                        desc: Path to the PNG, relative to assets/<namespace>/.
                        link: identifier
                    width:
                        desc: Width in pixels of the region to draw, measured from the top-left of the file.
                        type: integer
                        default: unspec
                    height:
                        desc: Height in pixels of the region to draw, measured from the top-left of the file.
                        type: integer
                        default: unspec
    identifier:
        type: string
        allow: '*a-z0-9_#\/:.-'
        hook: [ns]
    ingredient_key:
        - nopanel: true
        link: ingredient
    ingredient:
        or:
          - title: single
            link: ingredient_select
          - title: multiple
            type: list
            vals:
                link: ingredient_select
    ingredient_select:
        or:
          - title: simple
            link: identifier
          - type: object
            props:
                or:
                  - item:
                        desc: ID of a registered item.
                        link: identifier
                  - tag:
                        desc: ID of an item tag.
                        link: identifier
    integer_amp:
        desc: The minimum and maximum amplifier of the status effect.
        type: integer
        min: 0
        max: 2147483647
    integer_dur:
        desc: The minimum and maximum duration of the status effect.
        type: integer
        min: -1
        max: 2147483647
    inventory_type:
        desc: Determines whether to reference the inventory of the entity or the inventory of the power present in the entity.
        enum: ['inventory','power']
    item_slot:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/item-slot
        desc: Represents a slot from an entity or container's inventory. Refer to the doc for more information.
        type: string
    item_stack:
        type: object
        props:
            or:
              - id:
                    desc: ID of a registered item.
                    link: identifier
              - item:
                    desc: (DEPRECATED) ID of a registered item.
                    link: identifier
            or:
              - count:
                    desc: Size of the stack.
                    type: integer
                    default: 1
              - amount:
                    desc: (DEPRECATED) Size of the stack.
                    type: integer
                    default: 1
            tag:
                link: nbt
    key:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/key
        desc: Defines which key an active power reacts to - a built-in key or one you define in a datapack. See the doc for more information.
        type: object
        props:
            key:
                desc: The keybinding’s translation key.
                type: string
                allow: 'a-z0-9._-'
            continuous:
                desc: If false, the power activates once when the key is first pressed. If true, it tries to activate every tick the key is held (still respecting cooldown and conditions).
                type: boolean
                default: false
    meta_condition_chance:
        chance:
            href: https://0vergrown.github.io/Handbook/docs/datapack/meta-conditions/chance
            desc: Generates a random number between 0.0 and 1.0 and checks if it’s less than a specified value.
            link: number_percent
            required: true
    meta_condition_constant:
        value:
            desc: If true, the condition is always fulfilled. If false, the condition is never fulfilled.
            type: boolean
            default: false
    model_part_keyframe:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/model-part-keyframe
        desc: One point on a Model Part Transformation's timeline. The value that part should have reached at a given time.
        type: object
        props:
            time:
                type: float
            value:
                type: float
            easing:
                link: easing
    model_part_transformation:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/model-part-transformation
        desc: A single edit to one named part of a biped model. See the doc for more information.
        type: object
        props:
            model_part:
                desc: The part to edit.
                link: model_parts
                required: true
            type:
                desc: The type of transformation to apply.
                enum: ['pitch','yaw','roll','x_scale','y_scale','z_scale','pivot_x','pivot_y','pivot_z','visible','hidden','xscale','yscale','zscale','pivotx','pivoty','pivotz']
            value:
                desc: The amount. Its meaning is dependent on the selected transformation type.
                type: number
            override_animation:
                desc: For pitch/yaw/roll only. If true, the value becomes the absolute rotation and the vanilla animation for that axis is ignored (“locked”). If false, it is added on top of the animation.
                type: boolean
                default: false
            keyframes:
                desc: A timeline of values. When set, this replaces value and the part animates instead of holding still. The clock starts at 0 the moment the power becomes active.
                type: list
                vals:
                    link: model_part_keyframe
            loop:
                desc: If true, the keyframe timeline repeats forever. If false, it plays once and holds the last keyframe’s value.
                type: boolean
                default: false
            duration:
                desc: Ticks to fade the whole transformation in when the power becomes active. 0 applies it instantly, which is the original behaviour.
                type: number
                default: 0
                min: 0
            fade_out_duration:
                desc: Ticks to fade the whole transformation in when the power becomes active. 0 applies it instantly, which is the original behaviour.
                type: number
                default: unspec
                min: 0
            easing:
                desc: The curve used for the fade in and out, and the default curve for any keyframe that does not name its own.
                link: easing
    model_parts:
        enum: ['','head','hat','body','right_arm','left_arm','right_leg','left_leg','jacket','right_sleeve','left_sleeve','right_pants','left_pants']
        default: unspec
    nbt:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/nbt
        desc: A String or Object that defines a named binary tag (NBT) for storing arbitrary data. See the doc for more information.
        or:
          - title: simple
            type: string
            ext: true
          - title: advanced
            link: nbt_object
            extend: nbt_object
    nbt_object:
        nopanel: true
        or:
          - title: single
            type: string
            ext: true
          - title: multiple
            type: list
            vals:
                link: nbt_object
          - title: object
            link: nbt_object
            extend: nbt_object
    number_percent:
        type: number
        min: 0
        max: 1
    objective:
        type: string
        allow: 'a-zA-Z0-9_.+-'
    overlay_layer:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/overlay-layer
        desc: One render layer of an Entity Texture Overlay power — a single texture drawn over the player model with its own draw style, tint and target body parts. A power's layers field is an array of these, each independent and drawn in order on top of the base overlay.
        texture_location:
            desc: Texture used for both models. Used when a model-specific texture is not given. If omitted entirely, the layer inherits the power’s base wide/slim texture (handy for re-styling one part without repeating the texture).
            link: identifier
        wide_texture_location:
            desc: Texture used for the wide (Steve) model
            link: identifier
        slim_teture_location:
            desc: Texture used for the slim (Alex) model
            link: identifier
        render_type:
            link: render_type
        body_parts:
            desc: Restrict this layer to specific model parts (e.g. "head" or ["head", "body"]). When omitted, the layer covers the whole model. Part names follow Model Color: head, hat, body, right_arm, left_arm, right_leg, left_leg (plus jacket, the sleeves and the trousers). Matching ignores case and separators.
            link: model_parts
        red:
            link: number_percent
        green:
            link: number_percent
        blue:
            link: number_percent
        alpha:
            link: number_percent
        show_first_person:
            desc: If true, this layer is also drawn on the holder’s own first-person arm (only the arm/sleeve parts are affected in first person).
            type: boolean
            default: true
        scale:
            desc: Scales this layer’s geometry outward from the model origin — the same idea as Sync’s Energy Swirl size. Above 1.0 puffs the texture out past the skin (an aura/shell), below 1.0 pulls it inside. 1.0 sits flush on the body.
            link: number_percent
    particle_effect:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/particle-effect
        desc: A data type that's either a String which defines only the particle type or an Object which defines the particle type and its additional parameters.
        particle:
            desc: The namespace and ID of the particle type.
            or:
              - title: simple
                link: identifier
              - title: custom
                type: object
                props:
                    type:
                        desc: The namespace and ID of the particle type.
                        link: identifier
                    params:
                        desc: The additional parameters for the particle type.
                        type: string
                        ext: true
    player_abilities:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/player-abilities
        desc: A String used to represent a player's ability.
        enum: ['minecraft:flying','minecraft:instabuild','minecraft:invulnerable','minecraft:mayBuild','minecraft:mayfly']
    player_model_type:
        desc: A String used to pick one of the two vanilla player skin models.
        enum: ['wide','slim']
    positioned_item_stack:
        desc: An Object which defines a new item stack alongside a position in an inventory.
        type: object
        props:
            item:
                desc: ID of a registered item.
                link: identifier
            stack:
                desc: Size of the stack.
                type: integer
                default: 1
                min: 1
            tag:
                link: nbt
            slot:
                desc: Inventory slot position of the stack. If not specified, will be the first free slot in the inventory. See Positioned Item Stack Slots for possible values.
                type: integer
    process_mode:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/process-mode
        desc: A String that determines how an item stack is processed; be it either being modified or evaluated. See the doc for more information.
        enum: ['items','stacks']
    render_type:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/render-type
        desc: Selects how a texture is drawn onto the model — the blend/cull/lighting style of a render layer. See the doc for more information.
        enum: ['translucent','translucent-cull','cutout','cutout_no_cull','solid','emissive','eyes']
    rope_endpoint:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/rope-endpoint
        desc: Describes one end of a rope (how it is chosen at runtime) used by the from and to fields of the Attach Rope. See the doc for more information.
        type: object
        props:
            source:
                desc: "Where the endpoint comes from. One of: self (the acting entity), target (the bi-entity target — only resolves when the action runs in a bi-entity context), raycast (cast a ray from the actor’s eyes), position (a fixed point)."
                enum: ['self','target','raycast','position']
            distance:
                desc: For raycast - how far the ray reaches.
                type: number
                default: 30
            entities:
                desc: For raycast - whether the ray can attach to an entity it hits.
                type: boolean
                default: false
            blocks:
                desc: For raycast - whether the ray can attach to a block it hits. When both entities and blocks are enabled the nearest hit wins.
                type: boolean
                default: true
            position:
                desc: For position - The fixed [x,y,z] world coordinate.
                type: list
                vals:
                    type: number
    rope_mode:
        desc: |
            How the length constraint behaves.
            leash	free within length, springy swinging grapple past it (the default).
            spring	a soft elastic pull past length, so the rope visibly stretches and eases back (a rubber band).
            rigid	holds a fixed distance both ways — pulled in when too far and pushed out when too close (a rod/pole).
        enum: ['leash','spring','rigid']
    set_iteration:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/set-iteration
        desc: |
            A String used to determine which side of an entity set is walked.
            members		Walk the set the acting entity owns. The actor is the acting entity, and each target is one member of its set. The acting entity must hold the set power, otherwise nothing happens.
            owners		Walk the sets the acting entity is in. One iteration per entity whose set power currently contains the acting entity; the actor is that owner and the target is the acting entity. The acting entity does not need to hold the set power.
        enum: ['members','owners']
    shape:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/shape
        desc: |
            The outline of a region around a centre point.
            cube	\|dx\| ≤ rx, \|dy\| ≤ ry, \|dz\| ≤ rz (a box)
            sphere	(dx/rx)² + (dy/ry)² + (dz/rz)² ≤ 1 (an ellipsoid)
            star	\|dx\|/rx + \|dy\|/ry + \|dz\|/rz ≤ 1 (a stretched octahedron)
            cone	apex at centre, opening upward to height ry; the x/z spread reaches rx/rz at the top
            Per-axis extents are rounded up to whole blocks for block-based powers.
        enum: ['cube','sphere','star','cone']
    shape_type:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/shape-type
        desc: |
            A String used to determine how raycasts will handle blocks.
            collider	The ray will only stop at blocks with collision. (e.g: blocks that cannot be walked through)
            outline		The ray will take the shape of the block into account, only stopping if the ray has hit a face of a block.
            visual		The ray will only stop at blocks that are not considered transparent. (e.g: blocks that aren’t see-through)
        enum: ['collider','outline','visual']
    space:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/space
        desc: A String that defines which coordinate system is used for directions. See the doc for more information
        enum: ['world','local','local_horizontal','local_horizontal_normalized','velocity','velocity_normalized','velocity_horizontal','velocity_horizontal_normalized']
    stat:
        desc: An Object specifying a statistic via a statistic type and an Identifier.
        type: object
        props:
            type:
                desc: The type of the statistic.
                link: identifier
            id:
                desc: The name of the statistic; may depend on the specified type of the statistic.
                link: identifier
    status_effect_instance:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/status-effect-instance
        desc: An Object which defines a status effect with duration, amplifier, etc.
        type: object
        props:
            or:
              - id:
                desc: The identifier of the status effect.
                link: identifier
              - effect:
                desc: (DEPRECATED) The identifier of the status effect.
                link: identifier
            duration:
                desc: Determines the duration of the status effect in ticks.
                link: expression_integer
                default: 100
            amplifier:
                desc: Determines the strength of the status effect (0 being level 1).
                link: expression_integer
                default: 0
            or:
              - ambient:
                desc: Determines whether the particle effects of the status effect is less noticeable.
                type: boolean
                default: false
              - is_ambient:
                desc: (DEPRECATED) Determines whether the particle effects of the status effect is less noticeable.
                type: boolean
                default: false
            show_particles:
                desc: Determines whether the status effect should display particle effects on the entity.
                type: boolean
                default: true
            show_icon:
                desc: Determines whether the status effect should display an icon on the HUD.
                type: boolean
                default: true
    status_effect_instance_chance:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/status-effect-instance
        desc: An Object which defines a status effect with duration, amplifier, etc.
        type: object
        props:
            or:
              - id:
                desc: The identifier of the status effect.
                link: identifier
              - effect:
                desc: (DEPRECATED) The identifier of the status effect.
                link: identifier
            duration:
                desc: Determines the duration of the status effect in ticks.
                link: expression_integer
                default: 100
            amplifier:
                desc: Determines the strength of the status effect (0 being level 1).
                link: expression_integer
                default: 0
            or:
              - ambient:
                desc: Determines whether the particle effects of the status effect is less noticeable.
                type: boolean
                default: false
              - is_ambient:
                desc: (DEPRECATED) Determines whether the particle effects of the status effect is less noticeable.
                type: boolean
                default: false
            show_particles:
                desc: Determines whether the status effect should display particle effects on the entity.
                type: boolean
                default: true
            show_icon:
                desc: Determines whether the status effect should display an icon on the HUD.
                type: boolean
                default: true
            chance:
                desc: Chance of the status effect taking effect.
                link: number_percent
    team:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/team
        desc: A scoreboard team, given either by name or as a set of properties to match.
        or:
          - title: simple
            link: identifier
          - title: custom
            type: object
            props:
                name:
                    desc: The team’s name, as used by /team
                    link: identifier
                friendly_fire:
                    desc: Whether members can damage each other.
                    link: boolean_optional
    vector:
        type: object
        props:
            x:
                type: number
            y:
                type: number
            z:
                type: number
hooks: [preserve_single]
or:
  - title: simple
    link: power
  - title: multiple
    link: multi_power
  - title: custom
    link: custom_power
