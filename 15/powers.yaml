                            link: identifier
                        tag:
                            desc: NBT data to apply to projectiles.
                            link: nbt
                        entity_action_before_firing:
                            desc: If specified, the entity action to execute on the entity firing the projectile just prior to the projectile being created.
                            link: entity_action
                        projectile_action:
                            desc: If specified, this entity action will be executed on the projectile or entity that will be launched.
                            link: entity_action
                        tick_bientity_action:
                            desc: If specified, the bi-entity action with the projectile owner as the actor, and the projectile as the target that is run each tick of the projectile’s lifespan.
                            link: bientity_action
                        bientity_action_after_firing:
                            desc: If specified, the bi-entity action to execute with the projectile owner the actor, and the projectile as the target as soon as the projectile is created.
                            link: bientity_action
                        block_condition:
                            desc: If specified, the block condition that the block targeted by the block_action_on_hit field must meet in order for that to run.
                            link: block_condition
                        block_action_on_hit:
                            desc: If specified, the block action to execute on the block the projectile lands on upon having it land on it.
                            link: block_action
                        block_action_cancels_miss_action:
                            desc: Determines if the block_action_on_hit action will cancel the bientity_action_on_miss action.
                            type: boolean
                        bientity_condition:
                            desc: If specified, the bi-entity condition with the projectile as the actor and the target as the target for the projectile to actually hit the target instead of pass through.
                            link: bientity_condition
                        bientity_action_on_miss:
                            desc: If specified, the bi-entity action to execute with the projectile owner as the actor, and the projectile as the target upon missing.
                            link: bientity_action
                        bientity_action_on_hit:
                            desc: If specified, the bi-entity action to execute with the projectile as the actor, and the hit entity as the target upon hitting an entity.
                            link: bientity_action
                        owner_bientity_condition:
                            desc: If specified, the bi-entity condition with the projectile owner as the actor and the target as the target for the projectile to actually hit the target instead of pass through.
                            link: bientity_condition
                        owner_target_bientity_action_on_hit:
                            desc: If specified, the bi-entity action to execute with the projectile owner as the actor, and the hit entity as the target upon hitting an entity.
                            link: bientity_action
                        shooter_action:
                            desc: If specified, this entity action will be executed on the entity that has the power.
                            link: entity_action
                        key:
                            desc: Which active key this power should respond to. If none is specified, this power will use the primary active power key.
                            link: keybind
                        cooldown:
                            link: cooldown
                            default: 1
                        hud_render:
                            desc: 	Determines how the cooldown of this power is visualized on the HUD.
                            link: hud_render
                    string-origins:fluid_vision:
                        fluid:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/fluid_vision/
                            desc: Which submersion this applies to.
                            link: fluid
                        start:
                            desc: Where the fog starts, in blocks from the camera. 0 means it starts right at your eyes.
                            type: number
                            default: 0
                        end:
                            desc: Where the fog becomes fully opaque, in blocks. This is effectively how far you can see.
                            type: number
                            default: 15
                        fog_color:
                            desc: |
                                Overrides the fog tint. { "red": 0.0, "green": 0.0, "blue": 0.0 }, each 0.0–1.0.
                            type: object
                            props:
                                red:
                                    link: number_percent
                                green:
                                    link: number_percent
                                blue:
                                    link: number_percent
