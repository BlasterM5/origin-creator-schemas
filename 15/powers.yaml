                            vals:
                                link: meta_key
                    string-origins:game_event_listener:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/game_event_listener/
                            desc: If specified, the specified actions will only be executed if this condition is fulfilled by either or both ’actor’ and ’target’ entities.
                            link: bientity_condition
                        block_condition:
                            desc: If specified, only executes the actions if the game event or vibration is emitted by a block that fulfills the block condition.
                            link: block_condition
                        trigger_order:
                            desc: Determines whether the power type should prioritize game events by distance ("by_distance") or arbitrarily ("unspecified").
                            enum: ['unspecified','by_distance']
                            unspec: 'unspecified'
                        entity:
                            desc: Determines whether the power type should listen to game events emitted by entities.
                            type: boolean
                            unspec: true
                        block:
