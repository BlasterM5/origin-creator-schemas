                            desc: If specified, the specified actions will only be executed if the item stack from the output/result slot of the Grindstone fulfills this condition.
                            link: item_condition
                        item_action:
                            desc: If specified, this action will be executed on the result item stack.
                            link: item_action
                        item_action_after_grinding:
                            desc: If specified, this action will be executed on the result item stack after the grinding process.
                            link: item_action
                        or:
                          - title: result_type:specified
                            result_type:
                                desc: Replace the initial item stack with the item stack specified below.
                                const: 'specified'
                            result_stack:
                                desc: If specified, this item stack will be used as a replacement.
                                link: item_stack
                          - title: result_type:unchanged
                            result_type:
                                desc: Do not change the initial item stack.
                                const: 'unchanged'
                          - title: result_type:from_top
                            result_type:
                                desc: Replace the initial item stack with the item stack from the top input slot of the Grindstone block.
                                const: 'from_top'
                          - title: result_type:from_bottom
                            result_type:
                                desc: Replace the initial item stack with the item stack from the bottom input slot of a Grindstone block.
                                const: 'from_bottom'
                        block_action:
                            desc: If specified, this action will be executed on the Grindstone block upon taking the item stack from the result slot of the said Grindstone block.
                            link: block_action
                        entity_action:
                            desc: If specified, this action will be executed on the player upon taking the item stack from the result slot of a Grindstone.
                            link: entity_action
