                        damage:
                            desc: How much damage to deal each interval.
                            type: number
                            min: 0
                            required: true
                        damage_easy:
                            desc: Damage dealt on Easy difficulty.
                            type: number
                            min: 0
                            default: unspec
                        damage_type:
                            desc: The damage type to use.
