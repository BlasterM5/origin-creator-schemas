# 1.10.0-0vergrown
links:
    bientity_condition:
        unspec: none
        or:
          - title: original
            type: object
            props:
                inverted:
                    desc: If true, the condition acts inverted.
                    type: boolean
                type:
                    href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/bi-entity-condition-types
                    enum:
                      - origins:nothing
                      - origins:all_of
                      - origins:any_of
                      - origins:invert
                      - origins:actor_condition
                      - origins:target_condition
                      - origins:both
                      - origins:either
                      - origins:equal
                      - origins:undirected
                      - origins:attack_target
                      - origins:attacker
                      - origins:can_see
                      - origins:damage_would_kill
                      - origins:disguised
                      - origins:distance
                      - origins:in_entity_set
                      - origins:owner
                      - origins:relative_rotation
                      - origins:riding
                      - origins:riding_recursive
                      - origins:riding_root
                      - origins:roped_together
                      - origins:same_team
                      - origins:script
                      - origins:send_condition
                      - $DEPRECATED
                      - origins:and
                      - origins:or
                    more:
                        string-origins:nothing: {}
                        string-origins:all_of:
                            conditions:
                                extend: description_all_of
                                type: list
                                vals:
                                    link: bientity_condition
                        string-origins:and:
                            conditions:
                                extend: description_and
                                type: list
                                vals:
                                    link: bientity_condition
                        string-origins:any_of:
                            conditions:
                                extend: description_any_of
                                type: list
                                vals:
                                    link: bientity_condition
                        string-origins:or:
                            conditions:
                                extend: description_or
                                type: list
                                vals:
                                    link: bientity_condition
                        string-origins:random_chance:
                            chance:
                                link: meta_condition_random_chance
                        string-origins:chance:
                            chance:
                                link: meta_condition_chance
                        string-origins:constant:
                            value:
                                link: meta_condition_constant
                        string-origins:invert:
                            condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/invert/
                                desc: The bi-entity condition type to check which will have its ‘target’ and ‘actor’ contexts swapped.
                                link: bientity_condition
                        string-origins:actor_condition:
                            condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/actor_condition/
                                desc: The entity condition type to check for on the acting entity.
                                link: entity_condition
                        string-origins:attack_target: {}
                        string-origins:attacker: {}
                        string-origins:both:
                            condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/both/
                                desc: The entity condition type to check on both the actor and target entity.
                                link: entity_condition
                        string-origins:can_see:
                            shape_type:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/can_see/
                                link: shape_type
                                default: 'visual'
                            fluid_handling:
                                link: fluid_handling
                                default: 'none'
                        string-origins:damage_would_kill:
                            amount:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/damage_would_kill/
                                desc: The raw damage to simulate, before any reduction. Expressions are evaluated on the actor.
                                link: expression_float
                                required: true
                            damage_type:
                                desc: The damage type to simulate, e.g. minecraft:player_attack.
                                link: damage_type
                                required: true
                            modifier:
                                desc: Applied to amount before the simulation.
                                link: attribute_modifier
                            modifiers:
                                desc: Same, for several modifiers.
                                link: attribute_modifier_array
                        string-origins:disguised: {}
                        string-origins:distance:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/distance/
                                desc: Determines how the distance (in blocks) between the actor and target entities should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the distance (in blocks) between the actor and target entities will be compared to.
                                type: number
                        string-origins:either:
                            condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/either/
                                desc: The condition type to check on either actor or target entities.
                                link: entity_condition
                        string-origins:equal: {}
                        string-origins:in_entity_set:
                            set:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/in_entity_set/
                                desc: The ID of the power to check whether the target entity is in.
                                link: identifier
                        string-origins:owner: {}
                        string-origins:relative_rotation:
                            axes:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/relative_rotation/
                                desc: The axes to get the angle values to calculate, and compare to.
                                type: list
                                vals:
                                    enum: ['x','y','z']
                            actor_rotation:
                                desc: Determines the initial point of the rotation for the actor. Accepts "head" or "body".
                                enum: ['head','body']
                            target_rotation:
                                desc: Determines the initial point of the rotation for the target. Accepts "head" or "body".
                                enum: ['head','body']
                                default: 'body'
                            comparison:
                                desc: Determines how the calculated angle value should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the calculated angle value will be compared to.
                                type: number
                        string-origins:riding: {}
                        string-origins:riding_recursive: {}
                        string-origins:riding_root: {}
                        string-origins:roped_together: {}
                        string-origins:same_team:
                            allow_teamless:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/same_team/
                                desc: If true, two entities that are both on no team count as allied.
                                type: boolean
                        string-origins:script:
                            script:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/script/
                                link: identifier_script
                            params:
                                link: script_params
                        string-origins:send_condition:
                            receiver:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/send_condition/
                                link: meta_send_condition_action
                        string-origins:target_condition:
                            condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/target_condition/
                                desc: The entity condition type to check for on the target entity.
                                link: entity_condition
                        string-origins:undirected:
                            condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/undirected/
                                desc: The bi-entity condition type to check for. Checks if the specified bi-entity condition is true either before or after swapping the actor and target context.
                                link: bientity_condition
          - title: custom
            link: custom_condition
    entity_condition:
        unspec: none
        hooks: [fix_type]
        or:
          - title: original
            type: object
            props:
                inverted:
                    desc: Whether or not this condition is inverted (This condition passes only when the conditions are NOT met).
                    type: boolean
                type:
                    href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/bi-entity-condition-types
                    enum:
                      - origins:nothing
                      - origins:all_of
                      - origins:any_of
                      - origins:constant
                      - origins:random_chance
                      - origins:ability
                      - origins:advancement
                      - origins:air
                      - origins:attached_to_rope
                      - origins:attack_charge
                      - origins:attribute
                      - origins:biome
                      - origins:block_collision
                      - origins:block_in_radius
                      - origins:brightness
                      - origins:climbing
                      - origins:collided_horizontally
                      - origins:command
                      - origins:creative_flying
                      - origins:damage_would_kill
                      - origins:daytime
                      - origins:difficulty
                      - origins:dimension
                      - origins:disguised
                      - origins:distance_from_coordinates
                      - origins:elytra_flight_possible
                      - origins:enchantment
                      - origins:entity_group
                      - origins:entity_in_radius
                      - origins:entity_set_size
                      - origins:entity_type
                      - origins:equipped_item
                      - origins:exists
                      - origins:exposed_to_sky
                      - origins:exposed_to_sun
                      - origins:fall_distance
                      - origins:fall_flying
                      - origins:fluid_height
                      - origins:gamemode
                      - origins:glowing
                      - origins:has_command_tag
                      - origins:has_location
                      - origins:health
                      - origins:hunger
                      - origins:in_block
                      - origins:in_block_anywhere
                      - origins:in_rain
                      - origins:in_snow
                      - origins:in_tag
                      - origins:in_team
                      - origins:in_thunderstorm
                      - origins:inventory
                      - origins:invisible
                      - origins:key_pressed
                      - origins:living
                      - origins:moving
                      - origins:nbt
                      - origins:on_block
                      - origins:on_fire
                      - origins:owner
                      - origins:passenger
                      - origins:passenger_recursive
                      - origins:player_model_type
                      - origins:power
                      - origins:power_active
                      - origins:power_type
                      - origins:predicate
                      - origins:raycast
                      - origins:relative_health
                      - origins:resource
                      - origins:riding
                      - origins:riding_recursive
                      - origins:riding_root
                      - origins:saturation_level
                      - origins:scoreboard
                      - origins:script
                      - origins:send_condition
                      - origins:sneaking
                      - origins:sprinting
                      - origins:stat
                      - origins:status_effect
                      - origins:submerged_in
                      - origins:swimming
                      - origins:tamed
                      - origins:time_of_day
                      - origins:using_effective_tool
                      - origins:using_item
                      - origins:xp
                      - $Origins Conditions
                      - origins:origin
                      - origins:stored_origin
                      - origins:stored_value
                      - origins:swapped
                      - $DEPRECATED
                      - origins:and
                      - origins:or
                      - origins:chance
                      - origins:food_level
                      - origins:held_key
                      - origins:key_held
                      - origins:set_size
                      - origins:stats
                      - origins:status
                      - origins:statistic
                      - origins:team
                      - origins:xp_levels
                      - origins:xp_points
                      
                    more:
                        string-origins:nothing: {}
                        string-origins:all_of:
                            conditions:
                                extend: description_all_of
                                type: list
                                vals:
                                    link: entity_condition
                        string-origins:and:
                            conditions:
                                extend: description_and
                                type: list
                                vals:
                                    link: entity_condition
                        string-origins:any_of:
                            conditions:
                                extend: description_any_of
                                type: list
                                vals:
                                    link: entity_condition
                        string-origins:or:
                            conditions:
                                extend: description_or
                                type: list
                                vals:
                                    link: entity_condition
                        string-origins:random_chance:
                            chance:
                                link: meta_condition_random_chance
                        string-origins:chance:
                            chance:
                                link: meta_condition_chance
                        string-origins:constant:
                            value:
                                link: meta_condition_constant
                        string-origins:ability:
                            ability:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/ability/
                                desc: The namespace and ID of the ability to check for.
                                link: player_abilities
                        string-origins:advancement:
                            advancement:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/advancement/
                                desc: The namespace and ID of the advancement the player needs to have completed in order for this condition to evaluate to true. Only works on players!
                                link: advancement
                        string-origins:air:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/air/
                                desc: Determines how the breath / air / bubble (in ticks) the entity has should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the breath / air / bubble (in ticks) the entity has will be compared to.
                                type: integer
                        string-origins:attached_to_rope:
                            slot:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/attached_to_rope/
                                desc: Only count ropes with this label. If omitted, all ropes the entity is an end of are counted.
                                link: meta_key
                            comparison:
                                desc: How the rope count is compared against compare_to.
                                link: comparison
                            compare_to:
                                desc: The number the rope count is compared against.
                                type: integer
                                default: 1
                        string-origins:attack_charge:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/attack_charge
                                desc: How the charge is compared to compare_to.
                                link: comparison
                                default: '<='
                            compare_to:
                                desc: The charge to compare against, from 0.0 (just swung) to 1.0 (fully recharged).
                                link: expression_float
                                default: 0.9
                        string-origins:attribute:
                            attribute:
                                desc: |
                                    ID of the attribute of which the value should be checked. See Minecraft Wiki: Attribute (Attributes) for a list of vanilla attributes that can be checked for. Beware that newer Minecraft uses a different format than what is supported in this version.
                                href: https://minecraft.wiki/w/Attribute
                                link: attribute
                            comparison:
                                desc: Determines how the attribute’s total value should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the attribute’s total value will be compared to.
                                type: number
                        string-origins:biome:
                            condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/biome/
                                desc: If specified, only evaluate the condition to true if the biome the entity is in fulfills the specified biome condition type.
                                link: biome_condition
                            biome:
                                desc: If specified, only evaluate the condition to true if the biome the entity is in matches the specified namespace and ID.
                                href: https://minecraft.wiki/w/Biome#Biome_IDs
                                link: biome
                            biomes:
                                desc: If specified, only evaluate the condition to true if the biome the entity is in matches one of the specified namespace and IDs.
                                href: https://minecraft.wiki/w/Biome#Biome_IDs
                                type: list
                                vals:
                                    link: biome
                        string-origins:block_collision:
                            block_condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/block_collision
                                desc: If specified, the condition type will only evaluate to true if the bounding box of the entity is colliding with a block that fulfills this condition.
                                link: block_condition
                            offset_x:
                                desc: |
                                    By how much of the bounding box size should the box be offset in the X direction (e.g.: 0 = no offset, 1 = offset of exact width, 2 = offset of twice the width of the bounding box)
                                type: number
                                default: 0
                            offset_y:
                                desc: |
                                    By how much of the bounding box size should the box be offset in the Y direction (e.g.: 0 = no offset, 1 = offset of exact width, 2 = offset of twice the width of the bounding box)
                                type: number
                                default: 0
                            offset_z:
                                desc: |
                                    By how much of the bounding box size should the box be offset in the Z direction (e.g.: 0 = no offset, 1 = offset of exact width, 2 = offset of twice the width of the bounding box)
                                type: number
                                default: 0
                        string-origins:block_in_radius:
                            block_condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/block_in_radius
                                desc: The block condition type to check for.
                                link: block_condition
                            radius:
                                desc: The radius of the area to check how many blocks fulfill the block_condition.
                                type: integer
                            shape:
                                link: shape
                            comparison:
                                desc: Determines how the amount of blocks which fulfill block_condition block condition should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the amount of blocks which fulfill block_condition will be compared to.
                                link: expression_integer
                                default: 1
                        string-origins:brightness:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/brightness
                                desc: Determines how the calculated brightness value should be compared to the specified value. See the doc for more information.
                                link: comparison
                            compare_to:
                                desc: The value at which the calculated brightness value will be compared to.
                                type: number
                        string-origins:climbing: {}
                        string-origins:collided_horizontally: {}
                        string-origins:command:
                            command:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/command/
                                desc: The command to execute.
                                type: string
                                ext: true
                            comparison:
                                desc: Determines how the result value (an integer) of the executed command should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the result value (an integer) of the executed command will be compared to.
                                type: integer
                        string-origins:creative_flying: {}
                        string-origins:damage_would_kill:
                            amount:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/damage_would_kill/
                                desc: The raw damage to simulate, before any reduction.
                                link: expression_float
                            damage_type:
                                desc: The damage type to simulate.
                                link: damage_type
                            modifier:
                                desc: Applied to amount before the simulation.
                                link: attribute_modifier
                            modifiers:
                                desc: Same, for several modifiers.
                                link: attribute_modifier_array
                        string-origins:daytime: {}
                        string-origins:difficulty:
                            difficulty:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/difficulty/
                                desc: One of peaceful, easy, normal, hard, or an array of them. An array passes if the current difficulty is any one of them.
                                or:
                                  - title: single
                                    link: difficulty
                                  - title: multiple
                                    type: list
                                    vals:
                                        link: difficulty
                        string-origins:dimension:
                            dimension:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/dimension/
                                desc: The namespace and ID of the dimension the player needs to be in for this condition to evaluate to true. Namespace and IDs of custom/modded dimensions should also work.
                                link: dimension
                        string-origins:disguised: {}
                        string-origins:distance_from_coordinates:
                            reference:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/distance_from_coordinates
                                desc: The point to compare the distance to.
                                enum: ['world_origin','world_spawn']
                            offset:
                                desc: If specified, determines how much the reference point should be offset.
                                link: vector
                            ignore_x:
                                desc: Determines whether to consider the X axis to be 0.
                                type: boolean
                            ignore_y:
                                desc: Determines whether to consider the Y axis to be 0.
                                type: boolean
                            ignore_z:
                                desc: Determines whether to consider the Z axis to be 0.
                                type: boolean
                            shape:
                                link: shape
                            scale_reference_to_dimension:
                                desc: Determines whether to check for the reference point whilst considering the coordinate scale of the dimension.
                                type: boolean
                                unspec: true
                            result_on_the_wrong_dimension:
                                desc: If specified, this value will override the result of the comparison if the block being tested is not in the reference's dimension.
                                type: boolean_optional
                            round_to_digit:
                                desc: |
                                    If specified, rounds the result to the closest number with the specified amount of digits after the comma. Negative numbers also work (e.g: -2 rounds to multiples of 100).
                                type: integer
                                default: unspec
                            comparison:
                                desc: Determines how the calculated distance is compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the calculated distance is compared to.
                                type: number
                        string-origins:elytra_flight_possible:
                            check_state:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/elytra_flight_possible
                                desc: If set to true, the entity condition type will check if pressing the key.jump keybind would activate elytra flight if the player had the ability to.
                                type: boolean
                            check_abilities:
                                desc: |
                                    If set to true, the entity condition type will check whether the player has the ability to activate elytra flight. (e.g: wearing an elytra or have a power that uses the apoli:elytra_flight)
                                type: boolean
                                unspec: true
                        string-origins:enchantment:
                            enchantment:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/enchantment
                                desc: The namespace and ID of the enchantment of interest.
                                link: enchantment
                            calculation:
                                desc: Which number to compare - either the sum of levels of this enchantment on all of the player’s equipment, or the max level of this enchantment on any of the player’s equipment.
                                enum: ['sum','max']
                            comparison:
                                desc: Determines how the level of the specified enchantment should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the level of the specified enchantment will be compared to.
                                type: integer
                        string-origins:entity_group:
                            group:
                                desc: Entity group required for the entity to pass the check.
                                href: https://minecraft.wiki/w/Mob#Classification
                                enum: ['default','undead','arthropod','illager','aquatic']
                        string-origins:entity_in_radius:
                            bientity_condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/entity_in_radius
                                desc: Optional condition to filter counted entities (actor = the entity this condition runs on, target = each nearby entity).
                                link: bientity_condition
                            shape:
                                desc: Determines the shape of the area used for checking entities.
                                link: shape
                            radius:
                                desc: Radius/distance for detection, in blocks.
                                type: number
                                required: true
                            comparison:
                                desc: How to compare the count.
                                link: comparison
                            compare_to:
                                desc: The value to compare the count against.
                                link: expression_integer
                                default: 1
                        string-origins:entity_set_size:
                            set:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/entity_set_size
                                desc: The ID of the power.
                                link: identifier
                            comparison:
                                desc: Determines how the amount of referenced entities in the specified power should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the amount of referenced entities in the specified power will be compared to.
                                type: integer
                        string-origins:set_size:
                            set:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/entity_set_size
                                desc: (DEPRECATED) The ID of the power.
                                link: identifier
                            comparison:
                                desc: Determines how the amount of referenced entities in the specified power should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the amount of referenced entities in the specified power will be compared to.
                                type: integer
                        string-origins:entity_type:
                            entity_type:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/entity_type
                                desc: The entity type the entity needs to have. Prefix with \# to match an entity type tag instead.
                                link: entity_type
                        string-origins:equipped_item:
                            equipment_slot:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/equipped_item
                                desc: Determines which equipment slot to check for the item.
                                link: equipment_slot
                            item_condition:
                                desc: The item condition type to check for on the item in the specified equipment slot.
                                link: item_condition
                        string-origins:exists: {}
                        string-origins:exposed_to_sky: {}
                        string-origins:exposed_to_sun: {}
                        string-origins:fall_distance:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/fall_distance
                                desc: Determines how the fall distance of the entity should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the fall distance of the entity will be compared to.
                                type: number
                        string-origins:fall_flying: {}
                        string-origins:fluid_height:
                            fluid:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/fluid_height
                                desc: |
                                    ID of the fluid tag of which the height should be checked.
                                link: identifier
                            comparison:
                                desc: Determines how the height of the fluid should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the height of the fluid will be compared to.
                                type: number
                        string-origins:gamemode:
                            gamemode:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/gamemode
                                desc: Name of the gamemode the player should have in order for this condition to evaluate to true. Only works on the local player.
                                enum: ['survival', 'creative', 'adventure', 'spectator']
