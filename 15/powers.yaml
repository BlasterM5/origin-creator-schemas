                        hands:
                            desc: Determines whether the specified actions should be executed if the player used the specified hand(s) when trying to place a block.
                            type: list
                            vals:
                                link: hand
                        held_item_action:
                            desc: If specified, this item action will be executed on the item the player has used to try to place a block.
                            link: item_action
                        result_stack:
                            desc: If specified, this item stack will be given to the player upon trying to place a block.
                            link: item_stack
                        result_item_action:
                            desc: If specified, this item action will be executed on the item that will be given to the player upon trying to place a block.
                            link: item_action
                        entity_action:
                            desc: If specified, this entity action will be executed on the player upon being prevented from placing a block.
                            link: entity_action
                        place_to_action:
                            desc: If specified, this block action will be executed at the position of the block the player tried to place.
                            link: block_action
                        place_on_action:
                            desc: If specified, this block action will be executed on the block the player tried to place a block on.
                            link: block_action
                    string-origins:prevent_block_selection:
                        block_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_block_selection/
                            desc: If specified, only blocks that fulfill this condition are affected.
                            link: block_condition
                    string-origins:prevent_block_use:
                        block_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_block_use/
                            desc: If specified, only blocks that fulfill this condition are affected.
                            link: block_condition
                    string-origins:prevent_death:
                        damage_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_death/
                            desc: If specified, death will only be prevented if the damage dealt to the entity fulfills this condition.
                            link: damage_condition
                        entity_action:
                            desc: If specified, this action will be executed on the entity when death is prevented.
                            link: entity_action
                    string-origins:prevent_elytra_flight:
                        entity_action:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_elytra_flight/
                            desc: If specified, this action will be executed upon the entity trying to fly an Elytra/power that uses the apoli:elytra_flight.
                            link: entity_action
                    string-origins:prevent_entity_collision:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_entity_collision/
                            desc: If specified, the collision will only be prevented if this condition is fulfilled by either or both ’actor’ and ’target’ entities.
                            link: bientity_condition
                    string-origins:prevent_entity_render:
                        entity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_entity_render/
                            desc: If specified, only entities which fulfills this condition will be affected.
                            link: entity_condition
                        bientity_condition:
                            desc: If specified, the power will only be active if this condition is fulfilled by either or both the ‘actor’ (the player that has the power) and ‘target’ (the entity that will not render) entities.
                            link: bientity_condition
                    string-origins:prevent_entity_selection:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_entity_selection
                            desc: If specified, only entities which fulfills this bi-entity condition type in relation to the entity that has the power will not be able to be selected by players with this power.
                            link: bientity_condition
                        entity_condition:
                            desc: If specified, only entities that fulfills this entity condition type will not be able to be selected by players with this power.
                            link: entity_condition
                    string-origins:prevent_entity_use:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_entity_use/
                            desc: If specified, the specified actions will only be executed if this condition is fulfilled by either or both ’actor’ and ’target’ entities.
                            link: bientity_condition
                        item_condition:
                            desc: If specified, the specified actions will only be executed if this condition is fulfilled by the item used by the ’actor’ entity for right-clicking the ’target’ entity.
                            link: item_condition
                        hands:
                            desc: Determines if the power should be activated if the ’actor’ entity used the specified hand(s). Accepts "off_hand", "main_hand" or both.
                            type: list
                            vals:
                                link: hand
                        result_stack:
                            desc: If specified, this item stack will be given to the ’actor’ entity.
                            link: item_stack
                        bientity_action:
                            desc: The action to execute upon preventing other players from right-clicking the entity that has the power if specified.
                            link: bientity_action
                        held_item_action:
                            desc: If specified, this action will be executed on the item used by the ’actor’ entity for right-clicking the ’target’ entity.
                            link: item_action
                        result_item_action:
                            desc: If specified, this action will be executed on the item that is given to the ’actor’ entity.
                            link: item_action
                    string-origins:prevent_feature_render:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_feature_render/
                            desc: If specified, the layers are only hidden from viewers that fulfil the condition. The actor is the viewer, the target is the entity that has the power.
                            link: bientity_condition
                        feature:
                            desc: A single feature name to hide. Merged into features.
                            link: features
                        features:
                            desc: Feature names to hide. Omit both fields to hide every feature layer.
                            type: list
                            vals:
                                link: features
                    string-origins:prevent_game_event:
                        event:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_game_event/
                            desc: |
                                If specified, the game event with this namespace and ID will be prevented from being emitted by the entity. Prefix with # to name a game event tag instead.
                            link: game_event
                        events:
                            desc: |
                                If specified, the game events with these namespace and IDs will be prevented from being emitted by the entity. Each entry may be prefixed with # to name a game event tag.
                            type: list
                            vals:
                                link: game_event
                        tag:
                            desc: |
                                If specified, the game events inside this game event tag will be prevented from being emitted by the entity. The leading # is optional.
                            link: game_event_tag
                        entity_action:
                            desc: If specified, this action will be executed on the entity upon preventing game events.
                            link: entity_action
                    string-origins:prevent_item_use:
                        item_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_item_use/
                            desc: If specified, only items that fulfills this condition will be prevented from being used.
                            link: item_condition
                    string-origins:prevent_key_press:
                        keys:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_key_press/
                            desc: The keys to block. Left out, every key is blocked.
                            type: list
                            vals:
                                link: keybind
                            scroll:
                                desc: Also block the mouse wheel — hotbar scrolling and apoli:action_on_scroll_wheel. The wheel is not a keybind, so it needs its own switch. The default is true when keys is absent, otherwise false.
                                link: boolean_optional
                            affect_forced:
                                desc: Also block keys that apoli:force_key_pressed is holding down. Left false, a paralysed player can still be puppeted.
                                type: boolean
                            unpress:
                                desc: Release everything currently held the moment the block starts, so a player who was already running does not keep sliding.
                                type: boolean
                                unspec: true
                    string-origins:prevent_powers:
                        update_rate:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_powers/
                            desc: How often, in ticks, to re-check this power’s own condition. Raise it if the condition is expensive and does not need to be exact.
                            type: integer
                            min: 1
                            default: 5
                        powers:
                            desc: The power ids to suppress.
                            link: identifier_array
                            required: true
                    string-origins:prevent_sleep:
                        block_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_sleep/
                            desc: If specified, sleep will only be prevented if this condition is fulfilled by the bed block.
                            link: block_condition
                        message:
                            desc: The message that will be shown when sleep is prevented this way.
                            link: text_component
                        set_spawn_point:
                            desc: Determines whether the spawnpoint of the player is set upon right-clicking a bed while being prevented. (similar to what happens when you right-click a bed while it’s daytime)
                            type: boolean
                        priority:
                            desc: Determines the priority of which power will prevent the player to sleep, set their spawn and display a message. The power with set_spawn_point set to true and the highest priority value will be prioritized.
                            type: integer
                            default: 0
                    string-origins:prevent_sprinting: {}
                    string-origins:prevent_teleport:
                        entity_action:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_teleport/
                            desc: Runs on the entity each time a teleport is blocked. Good for a sound or a message; it fires once per blocked attempt, not once per tick.
                            link: entity_action
                        prevent_dimension_change:
                            desc: Whether portals and end gateways are blocked too. Set it to false to leave normal travel alone and only stop teleports within a dimension.
                            type: boolean
                            unspec: true
                    string-origins:prevent_use:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/prevent_use/
                            desc: Only block for this pairing.
                            link: bientity_condition
                        item_condition:
                            desc: Only block when the held item matches.
                            link: item_condition
                        target_used:
                            desc: false blocks the holder using others; true blocks others using the holder. Filled in by the aliases.
                            type: boolean
                        hands:
                            desc: Which hands are blocked — main_hand, off_hand, or both.
                            type: list
                            vals:
                                link: hand
                        result_stack:
                            desc: Replace the used stack with this when the use is blocked.
                            link: item_stack
            fabric:load_conditions:
                desc: Checks for the following namespaces or mods to be loaded and loads the power if true.
                gap: before
                unspec: none
                type: list
                vals:
                    link: fabric_load_conditions
    custom_power_base:
        title: custom
        type: object
        show: true
        props:
            condition:
                desc: If set, this power will only be active when the player with this power fulfills the condition.
                link: entity_condition
                gap: true
            type:
                desc: ID of the desired Power Type.
                type: string
        extra:
            link: nany
    power:
        title: power
        hooks: [fix_multiple]
        extend: [power_meta, power_base]
    custom_power:
        title: custom
        extend: [power_meta, custom_power_base]
    multi_power:
        title: multiple
        extend: power_meta
        props:
            type:
                desc: ID of the desired Power Type.
                const: origins:multiple
        extra:
            nopanel: true
            allowkey: '*a-z0-9_#\/:.-'
            or:
              - link: power_base
              - link: custom_power_base
    nany:
        nopanel: true
        or:
          - title: constant
            enum: [true, false, null]
          - type: number
          - type: string
          - type: list
            vals:
                link: nany
          - type: object
            extra:
                link: nany
    custom_action:
        type: object
        show: true
        props:
            type:
                link: identifier
        extra:
            link: nany
    custom_condition:
        type: object
        show: true
        props:
            inverted:
                type: boolean
            type:
                type: string
                allow: '*a-z0-9_#\/:.-'
        extra:
            link: nany

# Data Type Definitions and repeat schema links

    accessory_slot:
        or:
          - title: single
            link: meta_key
          - type: object
            props:
                group:
                    link: meta_key
                slot:
                    link: meta_key
                index:
                    type: integer
                provider:
                    enum: ['accessories','curios','trinkets']
    action_result:
        enum: ['consume_partial','consume','fail','pass','success']
        desc: |
            A String used to indicate the result of a certain action.
            consume_partial	Indicates that the action is performed but the actor’s hand is not swung and no statistic is incremented.
            consume	Indicates that the action is performed but the actor’s hand is not swung.
            fail	Indicates that the action is not performed and prevents other actions from performing.
            pass	Indicates that the action is not performed but allows other actions to perform.
            success	Indicates that the action is performed and the actor’s hand is swung.
