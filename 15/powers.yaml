                                type: number
                                default: 0
                            min_length:
                                desc: Shortest the rope can reel to.
                                type: number
                                default: 1
                            max_length:
                                desc: Longest the rope can be.
                                type: number
                                default: 30
                            start_length:
                                desc: The length the rope is created at, clamped to min_length–max_length. Left out, a controllable rope starts taut — exactly as far apart as its two ends already are, so a grapple bites the moment it lands — and a rope that is not controllable starts at max_length, so a tether has its full slack immediately. Set it explicitly when you want a taut tether or a slack grapple.
