                            desc: When this is set to true, the player will drop the items in the inventory on death (vanishing items will vanish!).
                            type: boolean
                        drop_on_death_filter:
                            desc: If this is set, only item stacks matching this condition will be dropped on death.
                            link: item_condition
                        recoverable:
                            desc: Determines if the content of the inventory should be dropped upon losing the power.
                            type: boolean
                            unspec: true
                        key:
                            desc: Which active key this power should respond to.
                            link: keybind
                    string-origins:invisibility:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/invisibility/
                            desc: If specified, the ’target’ will only be invisible to ’actors’ (either the player or mobs that may see the target) if the bi-entity condition is fulfilled by either or both of them.
                            link: bientity_condition
                        render_armor:
                            desc: Determines whether armor should be shown or not.
                            type: boolean
                        render_outline:
                            desc: Determines whether the glowing outline should be shown or not.
                            type: boolean
                        render_held_items:
                            desc: Determines whether items held in either hand should be shown or not. Set it to false to hide them along with the entity.
                            type: boolean
                            unspec: true
                    string-origins:invulnerability:
                        damage_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/invulnerability/
                            desc: Specifies which damage the player will be immune to.
                            link: damage_condition
                    string-origins:item_on_item:
                        using_item_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/item_on_item/
                            desc: If specified, the specified actions will only execute if this condition is fulfilled by the item that is used to right-click an item.
                            link: item_condition
                        on_item_condition:
                            desc: If specified, the specified actions will only execute if this condition is fulfilled by the item that has been right-clicked.
                            link: item_condition
                        result:
                            desc: 	If specified, this item will be given to the player.
                            link: item_stack
                        result_from_on_stack:
                            desc: Determines how many items based on the on_item stack will be given as a result for using an item on an item. Mostly to be used in conjunction with result_item_action.
                            type: integer
                            default: 0
                        using_item_action:
                            desc: If specified, this action will be executed on the item that is used to right-click an item.
                            link: item_action
                        on_item_action:
                            desc: If specified, this action will be executed on the item that has been right-clicked.
                            link: item_action
                        result_item_action:
                            desc: If specified, this action will be executed on the item that is given to the player.
                            link: item_action
                        entity_action:
                            desc: If specified, this action will be executed on the player after they used an item on an item.
                            link: entity_action
                        click_type:
                            desc: |
                                Which click runs the actions: "primary" (or 0) is a left-click, "secondary" (or 1) is a right-click.
                            enum: ['primary','secondary']
                            default: 'secondary'
                            unspec: 'secondary'
                    string-origins:keep_inventory:
                        item_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/keep_inventory/
                            desc: If specified, only make the items that fulfill the specified item condition type persist in the entity's inventory.
                            link: item_condition
                        slots:
                            desc: If specified, only make the items that are in the listed inventory slots persist in the entity's inventory. See Positioned Item Stack Slots for possible values.
                            type: list
                            vals:
                                type: integer
                    string-origins:lava_vision:
                        s:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/lava_vision/
                            desc: (DEPRECATED) Alias of start — where the fog starts, in blocks from the camera.
                            type: number
                            default: 0
                        v:
                            desc: Alias of end — where the fog becomes fully opaque, in blocks.
                            type: number
                            default: 15
                    string-origins:model_color:
                        red:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/model_color/
                            desc: |
                                Value by which the red component of the texture will be multiplied.
                            link: number_percent
                            default: 1
                        green:
                            desc: |
                                Value by which the green component of the texture will be multiplied.
                            link: number_percent
                            default: 1
                        blue:
                            desc: |
                                Value by which the blue component of the texture will be multiplied.
                            link: number_percent
                            default: 1
                        alpha:
                            desc: |
                                Value by which the alpha (= transparency) component of the texture will be multiplied.
                            link: number_percent
                            default: 1
                        parts:
                            desc: If specified, tints the listed model parts individually instead of the whole model. Each entry is a Part Color object (see below). Parts that are not listed are left untouched. The top-level red/green/blue/alpha fields are ignored when parts is present.
                            type: list
                            vals:
                                link: part_color
                    string-origins:night_vision:
                        strength:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/night_vision/
                            desc: |
                                How bright, from 0.0 (no change) to 1.0 (full Night Vision). Values in between give partial darkvision.
                            link: number_percent
                            default: 1
                    string-origins:overlay:
                        or:
                          - title: single
                            link: overlay_power
                          - title: multiple
                            overlays:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/powers/overlay/
                                desc: Several overlays in one power. All of them whose condition passes are drawn, in order, so this is a stack of layers rather than a pick-one.
                                type: object
                                extra:
                                    link: overlay_power_multiple
                    string-origins:particle:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/particle/
                            desc: If specified, the particle will only be visible if this bi-entity condition is fulfilled by either or both the entity that has the power and the entity looking at the entity that has the power.
                            link: bientity_condition
                        particle:
                            desc: The particle type that will be spawned.
                            link: particle_data
                        frequency:
                            desc: Determines how often the particles should spawn (interval in ticks).
                            type: integer
                        count:
                            desc: Determines the amount of particles to spawn.
                            type: integer
                            default: 1
                        space:
                            desc: |
                                How offset_* and the velocity are read. world uses the world axes; local is relative to the entity’s facing, so offset_z: 2 is two blocks in front of them and velocity_z: 0.5 fires the particles the way they are looking.
                            link: space
                            unspec: 'world'
                        offset_x:
                            desc: The offset of where the particle will be centered in the X axis.
                            type: number
                            default: 0
                        offset_y:
                            desc: The offset of where the particle will be centered in the Y axis.
                            type: number
                            default: 0.5
                        offset_z:
                            desc: The offset of where the particle will be centered in the Z axis.
                            type: number
                            default: 0
                        or:
                          - title: speed
                            speed:
                                desc: A number is vanilla’s random speed multiplier — every particle flies off in a random direction at up to that speed. A vector instead gives every particle that exact velocity, which is the version you want when the particles should go somewhere. Read through space.
                                or:
                                  - title: simple
                                    type: number
                                    default: 0
                                  - title: expression
                                    link: expression_float
                                  - title: vector
                                    link: vector
                          - title: velocity
                            velocity_x:
                                desc: The same explicit velocity, written per axis. Takes priority over a vector speed. Read through space.
                                type: number
                                default: 0
                            velocity_y:
                                desc: The same explicit velocity, written per axis. Takes priority over a vector speed. Read through space.
                                type: number
                                default: 0
                            velocity_z:
                                desc: The same explicit velocity, written per axis. Takes priority over a vector speed. Read through space.
                                type: number
                                default: 0
                        force:
                            desc: Determines whether to display the emitted particles within 512 blocks (true) or 32 blocks (false).
                            type: boolean
                        spread:
                            desc: Determines the size of the three-dimensional cuboid volume to spawn the specified particle type in.
                            link: vector
                        model_part:
                            desc: |
                                Anchor the particles to a body part instead of the entity’s feet: head, body, right_arm, left_arm, right_leg, left_leg. The same names apoli:model_color and apoli:modify_model_parts use. offset_* is then measured from that part.
                            link: model_parts
                        visible_in_first_person:
                            desc: Determines whether the particle type should be visible in first person.
                            type: boolean
                        visible_while_invisible:
                            desc: Determines whether the particle type should be visible if the entity is invisible.
                            type: boolean
                    string-origins:phasing:
                        block_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/phasing/
                            desc: If specified, the entity will only be able to move through these blocks (or not be able to move through these, depending on what blacklist is set to).
                            link: block_condition
                        blacklist:
                            desc: If set to true, the block_condition field will define which blocks the player can NOT move through.
                            type: boolean
                        render_type:
                            desc: Determines how the environment is rendered when “phasing” through (moving) blocks.
                            enum: ['none','blindness','remove_blocks']
                            default: 'blindness'
                            unspec: 'blindness'
                        view_distance:
                            desc: Determines how far the player can look through walls when “phasing” (moving) through blocks when render_type is set to "blindness".
                            type: number
                            default: 10
                        phase_down_condition:
                            desc: If specified, the entity will only be able to “phase” (move) downwards if this condition is fulfilled.
                            link: entity_condition
                    string-origins:pose:
                        entity_pose:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/pose/
                            desc: The entity pose to force. One of the vanilla Pose values.
                            link: entity_pose
                        arm_pose:
                            desc: The arm pose to force on humanoid models.
                            link: arm_pose
                        hands:
                            desc: Which hand(s) the arm_pose applies to. Accepts main_hand and/or off_hand (which arm that is follows the player’s main-hand setting). Hands not listed keep their vanilla pose. Has no effect on entity_pose.
                            type: list
                            vals:
                                link: hand
                        priority:
                            desc: Pick order when several pose powers are active at once — highest priority wins.
                            type: integer
                            default: 0
                    string-origins:receive_action:
                        entity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/receive_action/
                            desc: Gate on the entity action. When it fails, nothing runs — not even action.
                            link: entity_condition
                        bientity_condition:
                            desc: Gate on the bi-entity action.
                            link: bientity_condition
                        item_condition:
                            desc: Gate on the item action.
                            link: item_condition
                        entity_action:
                            desc: Runs when an entity apoli:send_action calls in.
                            link: entity_action
                        bientity_action:
                            desc: Runs when a bi-entity apoli:send_action calls in.
                            link: bientity_action
                        item_action:
                            desc: Runs when an item apoli:send_action calls in.
                            link: item_action
                        action:
                            desc: Runs on the holder whenever this power receives anything, whichever flavour sent it. Fires after the flavour-specific actions above.
                            link: entity_action
                    string-origins:receive_condition:
                        entity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/receive_condition/
                            desc: The answer given to an entity apoli:send_condition. Absent means “yes” — the sender passes as long as this power exists and is active.
                            link: entity_condition
                        bientity_condition:
                            desc: The answer given to a bi-entity apoli:send_condition.
                            link: bientity_condition
                        item_condition:
                            desc: The answer given to an item apoli:send_condition.
                            link: item_condition
                    string-origins:recipe:
                        recipe:
                            link: crafting_recipe
                    string-origins:replace_loot_table:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/replace_loot_table/
                            desc: If specified, the loot tables will only be replaced if this condition is fulfilled by either or both ’actor’ and ’target’ entities.
                            link: bientity_condition
                        item_condition:
                            desc: If specified, the loot tables will only be replaced if the item in the context of the loot tables fulfill this condition.
                            link: item_condition
                        block_condition:
                            desc: If specified, the loot tables will only be replaced if the block at the context of the loot tables fulfill this condition.
                            link: block_condition
                        replace:
                            desc: |
                                An object with "key": "value" pairs that determine which loot table ("key") will be replaced with a new loot table ("value").
                            type: object
                            extra:
                                link: meta_key_value_regex
                        priority:
                            desc: Determines the application priority of the power.
                            type: integer
                            default: 0
                    string-origins:replace_sound_emission:
                        sounds:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/replace_sound_emission/
                            desc: Map of sound to replace → what to replace it with.
                            type: object
                            extra:
                                link: meta_key_value
                            required: true
                        replace:
                            desc: Whether a match stops the original sound (and every lower-priority power). false plays the replacement on top of the original.
                            type: boolean
                            unspec: true
                        entity_action:
                            desc: Action run on the holder whenever one of its rules matches.
                            link: entity_action
                        priority:
                            desc: Ordering when the holder has several replace-sound powers. Higher runs first.
                            type: integer
                            default: 0
                    string-origins:replace_sound_reception:
                        sounds:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/replace_sound_emission/
                            desc: Map of sound to replace → what to replace it with.
                            type: object
                            extra:
                                link: meta_key_value
                            required: true
                        replace:
                            desc: Whether a match stops the original sound (and every lower-priority power). false plays the replacement on top of the original.
                            type: boolean
                            unspec: true
                        entity_action:
                            desc: Action run on the holder whenever one of its rules matches.
                            link: entity_action
                        priority:
                            desc: Ordering when the holder has several replace-sound powers. Higher runs first.
                            type: integer
                            default: 0
                    string-origins:resource:
                        min:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/resource/
                            desc: The minimum value of the resource. When an Expression, re-evaluated each tick. Omit it and the resource has no lower bound.
                            link: expression_integer
                        max:
                            desc: The maximum value of the resource. When an Expression, re-evaluated each tick. Omit it and the resource has no upper bound.
                            link: expression_integer
                        start_value:
                            desc: The value of the resource when the entity first receives the power.
                            link: expression_integer
                        size:
                            desc: How many values this resource stores. Above 1 the power becomes a table of that many slots, each addressed by a position from 0 to size - 1. Also aliased as positions and slots. There is no upper limit — see Big tables.
                            type: integer
                            default: 1
                        hud_render:
                            desc: Determines how the resource is visualized on the HUD. A bar needs a value to fill up to, so an uncapped resource needs a max on the hud_render — see Hud Render.
                            link: hud_render
                        enforce_limits:
                            desc: Whether the resource value is clamped to [min, max].
                            type: boolean
                            unspec: true
                        retain_value:
                            desc: |
                                When enforce_limits is true: if a modification would push the value outside the bounds, keep the old value instead of clamping.
                            type: boolean
                        min_action:
                            desc: Run on the entity whenever the value reaches min.
                            link: entity_action
                        max_action:
                            desc: Run on the entity whenever the value reaches max.
                            link: entity_action
                        persistent:
                            desc: When true, the value survives server restart (and survives the entity unloading/reloading). When false, the value resets to start_value whenever the entity rejoins the world. Useful for resources that semantically should reset, like daily-quest counters or cooldowns you want to clear on login.
                            type: boolean
                            unspec: true
                    string-origins:restrict_armor:
                        head:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/restrict_armor/
                            desc: If specified, items which fulfills this condition cannot be equipped in the head equipment slot.
                            link: item_condition
                        chest:
                            desc: If specified, items which fulfills this condition cannot be equipped in the chest equipment slot.
                            link: item_condition
                        legs:
                            desc: If specified, items which fulfills this condition cannot be equipped in the legs equipment slot.
                            link: item_condition
                        feet:
                            desc: If specified, items which fulfills this condition cannot be equipped in the feet equipment slot.
                            link: item_condition
                    string-origins:scare_mobs:
                        bientity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/scare_mobs/
                            desc: Which mobs are scared. The actor is the entity with the power, the target is the mob deciding whether to flee. Without it, every mob flees.
                            link: bientity_condition
                        radius:
                            desc: How close the mob has to be before it starts fleeing.
                            type: number
                            default: 6
                        speed:
                            desc: Movement speed multiplier while fleeing.
                            type: number
                            default: 1
                    string-origins:script:
                        on_added:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/script/
                            desc: Script to run when the power is granted.
                            link: identifier
                        on_removed:
                            desc: Script to run when the power is revoked.
                            link: identifier
                        params:
                            desc: Values handed to the script as params.
                            link: nbt
                    string-origins:self_glow:
                        entity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/self_glow/
                            desc: (ALIAS) If specified, only entities that fulfill this condition will see the entity that has the power glow.
                            link: entity_condition
                        bientity_condition:
                            desc: If specified, only entities that fulfill this bi-entity condition in relation to the entity that has the power will see the entity that has the power glow.
                            link: bientity_condition
                        use_teams:
                            desc: Determines whether glowing entities should use their team’s color with their glow. If set to false, the entity will instead use the red, green and blue fields within this power type.
                            type: boolean
                            unspec: true
                        red:
                            desc: |
                                Value by which the red component of the glow will be multiplied. Range: 0 - 1.
                            link: number_percent
                            default: 1
                        green:
                            desc: |
                                Value by which the green component of the glow will be multiplied. Range: 0 - 1.
                            link: number_percent
                            default: 1
                        blue:
                            desc: |
                                Value by which the blue component of the glow will be multiplied. Range: 0 - 1.
                            link: number_percent
                            default: 1
                    string-origins:shader:
                        shader:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/shader/
                            desc: Specifies the location of the shader resource file to use.
                            link: identifier
                        toggleable:
                            desc: Determines if the applied shader can be toggled.
                            type: boolean
                            unspec: true
                        priority:
                            desc: Which shader wins when the entity holds more than one Shader power at once. Highest priority is applied; ties are broken arbitrarily.
                            type: integer
                            default: 0
                    string-origins:shaking: {}
                    string-origins:show_both_arms:
                        off_hand:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/show_both_arms/
                            desc: Draw the off arm when the off hand is empty. This is the “see both hands” behaviour.
                            type: boolean
                            unspec: true
                        main_hand:
                            desc: Draw the main arm even while the main hand is holding an item, so you see the arm as well as the item. Filled maps are skipped — vanilla already draws both arms for those.
                            type: boolean
                        ghost_arms:
                            desc: How many extra “ghost” copies of each drawn arm to trail behind the live one while it swings. 0 disables the effect.
                            type: integer
                            min: 0
                            max: 16
                            default: 0
                        ghost_spacing:
                            desc: How far back each ghost sits, as a fraction of one swing. The nth ghost is drawn at the pose the arm held n × ghost_spacing of a swing ago, wrapping into the previous swing. Keep ghost_arms × ghost_spacing at or below 1.0; copies further back than a whole swing are skipped.
                            type: number
                            default: 0.12
                        ghost_alpha:
                            desc: Opacity of the ghosts (0.0 – 1.0). They are drawn translucent so the live arm reads clearly through them.
                            link: number_percent
                            default: 0.35
                    string-origins:simple: {}
                    string-origins:stacking_status_effect:
                        min_stacks:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/stacking_status_effect/
                            desc: The stack count the power jumps to the moment it becomes active. Set it above 1 for an effect that starts part-way up instead of ticking there one stack at a time. Negative numbers are allowed.
                            type: integer
                        max_stacks:
                            desc: 	The stack count it climbs to and stops at while active.
                            type: integer
                        duration_per_stack:
                            desc: Determines the duration of the specified status effect(s) for each stack.
                            type: integer
                        tick_rate:
                            desc: Determines how fast the power will gain/lose stacks in ticks.
                            type: integer
                            default: 10
                        effect:
                            desc: If specified, this status effect will be applied on the entity that has the power.
                            link: status_effect_instance
                        effects:
                            desc: If specified, these status effects will be applied on the entity that has the power.
                            type: list
                            vals:
                                link: status_effect_instance
                    string-origins:starting_equipment:
                        stack:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/starting_equipment/
                            desc: If specified, this item will be given to the player (can be specified in an inventory slot).
                            link: positioned_item_stack
                        stacks:
                            desc: If specified, these items will be given to the player (can be specified in an inventory slot).
                            type: list
                            vals:
                                link: positioned_item_stack
                        recurrent:
                            desc: Determines whether the specified item(s) should be given after respawning.
                            type: boolean
                    string-origins:swimming: {}
                    string-origins:toggle_night_vision:
                        strength:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/night_vision/
                            desc: |
                                (DEPRECATED) How bright, from 0.0 (no change) to 1.0 (full Night Vision). Values in between give partial darkvision.
                            link: number_percent
                            default: 1
                    string-origins:toggle:
                        active_by_default:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/toggle/
                            desc: Determines whether the state of this power type should be ON by default.
                            type: boolean
                            unspec: true
                        key:
                            desc: Which active key this power should respond to.
                            link: keybind
                        retain_state:
                            desc: Determines whether the power remains active even if the specified condition (if any) is no longer met. If set to true, the power will stay in its current state regardless of the condition. If set to false, the power will deactivate when the condition is not fulfilled.
                            type: boolean
                            unspec: true
                    string-origins:tooltip:
                        item_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/tooltip/
                            desc: If specified, the specified tooltip(s) will only apply to items that fulfills this condition.
                            link: item_condition
                        text:
                            desc: If set, apply this string as a tooltip.
                            link: text_component
                        texts:
