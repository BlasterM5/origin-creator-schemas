                    string-origins:disable_regen: {}
                    string-origins:disable_slot:
                        item_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/disable_slot/
                            desc: Only refuse items matching this condition. Omit it to seal the slot against everything.
                            link: item_condition
                        slot:
                            desc: A single slot to disable.
                            link: item_slot
                        slots:
                            desc: Several slots to disable. Merged with slot.
                            type: list
                            vals:
                                link: item_slot
                    string-origins:edible_item:
                        item_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/edible_item/
                            desc: If specified, will only make the item edible and the specified actions will only be executed if this condition is fulfilled by the item.
                            link: item_condition
                        food_component:
                            desc: The food component that the item grants upon eating it.
                            link: food_component
                        entity_action:
                            desc: If specified, this action will be executed on the player upon consuming an item.
                            link: entity_action
                        item_action:
                            desc: If specified, this action will be executed on the item consumed by the player.
                            link: item_action
                        result_item_action:
                            desc: If specified, this action will be executed on the item that is given to the player as a result of consuming an item.
                            link: item_action
                        result_stack:
                            desc: If specified, this item stack will be given to the player.
                            link: item_stack
                        consume_animation:
                            desc: Determines whether the animation effect for consuming the item should be “eating” ("eat", displays particle effects based on the item) or “drinking” ("drink", no particle effects.)
                            enum: ['eat','drink']
                            unspec: 'eat'
                        consume_sound:
                            desc: If specified, the sound event with this namespace and ID will be played when the item is eaten.
                            link: identifier
                            default: 'entity.generic.eat'
                            unspec: 'entity.generic.eat'
                        consuming_time_modifier:
                            desc: If specified, this modifier will be applied on the maximum time the item is being consumed (in ticks).
                            link: attribute_modifier
                        consuming_time_modifiers:
                            desc: If specified, these modifiers will be applied on the maximum time the item is being consumed (in ticks).
                            link: attribute_modifier_array
                    string-origins:effect_immunity:
                        inverted:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/effect_immunity/
                            desc: Determines whether to make the entity immune to the status effect(s) that aren’t specified.
                            type: boolean
                        effect:
                            desc: If specified, only the status effect with this namespace and ID can not be applied to the entity that has the power.
                            link: status_effect
                        effects:
                            desc: If specified, only the status effects with the specified namespace and IDs can not be applied to the entity that has the power.
                            link: status_effect_array
                    string-origins:elytra_flight:
                        render_elytra:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/elytra_flight/
                            desc: Determines whether an Elytra should render on the player’s back while this power is active.
                            type: boolean
                        texture_location:
                            desc: If specified, this will be the texture used by the Elytra granted by this power.
                            link: identifier
                            default: unspec
                    string-origins:entity_glow:
                        entity_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/entity_glow/
                            desc: If specified, only entities which fulfill this condition will glow for the player that has the power.
                            link: entity_condition
                        bientity_condition:
                            desc: If specified, the power will only be active if this condition is fulfilled by either or both the ‘actor’ (the player that has the power) and ‘target’ (the entity that would glow) entities.
                            link: bientity_condition
                        use_teams:
                            desc: Determines whether glowing entities should use their team’s color with their glow. If set to false, the entity will instead use the red, green and blue fields within this power type.
                            type: boolean
                            unspec: true
                        red:
                            desc: |
                                Value by which the red component of the glow will be multiplied. Range: 0.0 - 1.0.
                            link: number_percent
                            default: 1
                        green:
                            desc: |
                                Value by which the green component of the glow will be multiplied. Range: 0.0 - 1.0.
                            link: number_percent
                            default: 1
                        blue:
                            desc: |
                                Value by which the blue component of the glow will be multiplied. Range: 0.0 - 1.0.
                            type: number_percent
                            default: 1
                        self_glow_target:
                            desc: If true, the power makes the entity that has the power glow for everyone else, instead of making other entities glow for the holder. The apoli:self_glow type ID is an alias for this power with self_glow_target defaulting to true (see Self Glow).
                            type: boolean
                    string-origins:entity_set:
                        action_on_add:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/entity_set/
                            desc: If specified, this bi-entity action will be executed on either or both the ’actor’ and the ’target’ upon the ’target’ being added to the set.
                            link: bientity_action
                        action_on_remove:
                            desc: If specified, this bi-entity action will be executed on either or both the ’actor’ and the ’target’ upon the ’target’ being removed from the set.
