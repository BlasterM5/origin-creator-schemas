                    string-origins:modify_label_render:
                        tick_rate:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/modify_label_render/
                            desc: How often (in ticks) the server re-resolves text and re-checks the power’s condition. Higher = cheaper.
                            type: integer
                            default: 20
                        bientity_condition:
                            desc: Tested with the viewer as actor and the holder as target, client-side.
                            link: bientity_condition
                        entity_condition:
                            desc: Tested against the viewer (the player looking at the holder), client-side. The label modification only applies for viewers who pass.
                            link: entity_condition
                        before_parse_action:
                            desc: Runs on the holder (server side) right before each text resolve.
                            link: entity_action
                        text:
                            desc: |
                                Replacement label text. Selector/score components (e.g. {"selector": "@s"}, score lookups) are resolved on the server every tick_rate ticks. Omit for a mode-only power (e.g. just hiding the label).
                            link: text_component
                        render_mode:
                            desc: default (label shows normally), hide_partially (renders like a sneaking player’s, dim, not visible through walls), hide_completely (no label at all).
                            enum: ['default','hide_partially','hide_completely']
                        override_chat_name:
                            desc: |
                                Player holders only: the resolved label replaces their name everywhere the server uses a display name: chat, both directions of /msg (the “X whispers to you” line and the “You whisper to X” line), /say, /me, team chat, death messages, advancement announcements and join/leave messages.
                            type: boolean
                        override_tab_name:
                            desc: |
                                Player holders only: the resolved label also replaces their name in the multiplayer tab list.
                            type: boolean
                        after_parse_action:
                            desc: Runs on the holder (server side) whenever a resolve produced a changed text.
                            link: entity_action
                        priority:
                            desc: When several modify_label_render powers apply to the same holder, the highest priority (that passes its viewer conditions) wins.
                            type: integer
                            default: 0
