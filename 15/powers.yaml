                                href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-actions/transfer
                                desc: steal moves powers target → actor; give moves them actor → target.
                                enum: [steal, give]
                            copy:
                                desc: If false, powers are moved (removed from the donor). If true, they are copied (the donor keeps them).
                                type: boolean
                                default: false
                            sources:
                                desc: Only transfer powers granted by these sources. If omitted, every source on the donor is transferred (except new_source). This is how you copy one specific origin/layer — filter to the source it was granted under.
