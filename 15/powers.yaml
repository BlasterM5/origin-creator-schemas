                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/damage_over_time/
                            desc: (DEPRECATED) How much damage to deal each interval.
                            type: integer
                            min: 0
                            default: 20
                        onset_delay:
                            desc: Ticks to wait after the condition becomes true before the first hit.
                            type: integer
                            min: 0
