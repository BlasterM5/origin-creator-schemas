# 1.10.0
links:
    bientity_condition:
        unspec: none
        or:
          - title: original
            type: object
            props:
                inverted:
                    desc: If true, the condition acts inverted.
                    type: boolean
                type:
                    href: https://0vergrown.github.io/Handbook/docs/datapack/bientity-conditions/bi-entity-condition-types
                    enum:
                      - origins:all_of
                      - origins:any_of
                      - origins:constant
                      - origins:invert
                      - origins:random_chance
                      - origins:actor_condition
                      - origins:attack_target
                      - origins:attacker
                      - origins:both
                      - origins:can_see
                      - origins:disguised
                      - origins:distance
                      - origins:either
                      - origins:equal
                      - origins:in_entity_set
                      - origins:owner
                      - origins:relative_rotation
                      - origins:riding
                      - origins:riding_recursive
                      - origins:riding_root
                      - origins:roped_together
                      - origins:same_team
                      - origins:target_condition
                      - origins:undirected
                      - $DEPRECATED
                      - origins:and
                      - origins:or
                      - origins:chance
                    more:
                        string-origins:all_of:
                            conditions:
                                desc: Passes when every listed condition passes.
                                type: list
                                vals:
                                    link: bientity_condition
                        string-origins:and:
                            conditions:
                                desc: (DEPRECATED) Passes when every listed condition passes.
                                type: list
                                vals:
                                    link: bientity_condition
                        string-origins:any_of:
                            conditions:
                                desc: Passes when any listed condition passes.
                                type: list
                                vals:
                                    link: bientity_condition
                        string-origins:or:
                            conditions:
                                desc: (DEPRECATED) Passes when any listed condition passes.
                                type: list
                                vals:
                                    link: bientity_condition
                        string-origins:constant:
                            link: meta_condition_constant
                        string-origins:invert:
                            condition:
                                desc: Swaps the context of the target entity and the actor entity.
                                link: bientity_condition
                        string-origins:random_chance:
                            link: meta_condition_chance
                        string-origins:chance:
                            link: meta_condition_chance
                        string-origins:actor_condition:
                            condition:
                                desc: Checks for an Entity Condition Type on the actor entity.
                                link: entity_condition
                        string-origins:attack_target: {}
                        string-origins:attacker: {}
                        string-origins:both:
                            condition:
                                desc: Checks for an entity condition on both the actor and target entities.
                                link: entity_condition
                        string-origins:can_see:
                            condition:
                                desc: Checks whether the straight path from the actor entity's eyes to the target entity's eyes is unobstructed.
                                type: object
                                props:
                                    shape_type:
                                        link: shape_type
                                        default: 'visual'
                                    fluid_handling:
                                        link: fluid_handling
                                        default: 'none'
                        string-origins:disguised: {}
                        string-origins:distance:
                            comparison:
                                desc: Determines how the distance (in blocks) between the actor and target entities should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the distance (in blocks) between the actor and target entities will be compared to.
                                type: number
                        string-origins:either:
                            condition:
                                desc: 	The condition type to check on either actor or target entities.
                                link: entity_condition
                        string-origins:equal: {}
                        string-origins:in_entity_set:
                            set:
                                desc: The ID of the power to check whether the target entity is in.
                                link: identifier
                        string-origins:owner: {}
                        string-origins:relative_rotation:
                            axes:
                                desc: The axes to get the angle values to calculate, and compare to.
                                type: list
                                vals:
                                    enum: ['x','y','z']
                            actor_rotation:
                                desc: Determines the initial point of the rotation for the actor. Accepts "head" or "body".
                                enum: ['head','body']
                                default: 'head'
                            target_rotation:
                                desc: Determines the initial position of the rotation for the target. Accepts "head" or "body".
                                enum: ['head','body']
                                default: 'body'
                            comparison:
                                desc: Determines how the calculated angle value will be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value to compare the calculated angle value to.
                                type: number
                        string-origins:riding: {}
                        string-origins:riding_recursive: {}
                        string-origins:riding_root: {}
                        string-origins:roped_together: {}
                        string-origins:same_team:
                            allow_teamless:
                                desc: If true, two entities that are both on no team count as allied.
                                type: boolean
                        string-origins:target_condition:
                            condition:
                                desc: The condition to check for on the target entity.
                                link: entity_condition
                        string-origins:undirected:
                            condition:
                                desc: The bi-entity condition to check for truth before or after swapping the actor and target context.
                                link: bientity_condition
          - title: custom
            link: custom_condition
    entity_condition:
        unspec: none
        hooks: [fix_type]
        or:
          - title: original
            type: object
            props:
                inverted:
                    desc: Whether or not this condition is inverted (This condition passes only when the conditions are NOT met).
                    type: boolean
                type:
                    href: https://origins.readthedocs.io/en/latest/types/entity_condition_types/
                    enum:
                      - origins:all_of
                      - origins:any_of
                      - origins:constant
                      - origins:random_chance
                      - origins:ability
                      - origins:advancement
                      - origins:air
                      - origins:attached_to_rope
                      - origins:attack_charge
                      - origins:attribute
                      - origins:biome
                      - origins:block_collision
                      - origins:block_in_radius
                      - origins:brightness
                      - origins:climbing
                      - origins:collided_horizontally
                      - origins:command
                      - origins:creative_flying
                      - origins:daytime
                      - origins:dimension
                      - origins:disguised
                      - origins:distance_from_coordinates
                      - origins:elytra_flight_possible
                      - origins:enchantment
                      - origins:entity_group
                      - origins:entity_in_radius
                      - origins:entity_set_size
                      - origins:entity_type
                      - origins:equipped_item
                      - origins:exists
                      - origins:exposed_to_sky
                      - origins:exposed_to_sun
                      - origins:fall_distance
                      - origins:fall_flying
                      - origins:fluid_height
                      - origins:food_level
                      - origins:gamemode
                      - origins:glowing
                      - origins:health
                      - origins:hunger
                      - origins:in_block
                      - origins:in_block_anywhere
                      - origins:in_rain
                      - origins:in_snow
                      - origins:in_tag
                      - origins:in_team
                      - origins:in_thunderstorm
                      - origins:inventory
                      - origins:invisible
                      - origins:key_pressed
                      - origins:living
                      - origins:moving
                      - origins:nbt
                      - origins:on_block
                      - origins:on_fire
                      - origins:origin
                      - origins:passenger
                      - origins:passenger_recursive
                      - origins:player_model_type
                      - origins:power
                      - origins:power_active
                      - origins:power_type
                      - origins:predicate
                      - origins:raycast
                      - origins:relative_health
                      - origins:resource
                      - origins:riding
                      - origins:riding_recursive
                      - origins:riding_root
                      - origins:saturation_level
                      - origins:scoreboard
                      - origins:sneaking
                      - origins:sprinting
                      - origins:stat
                      - origins:status_effect
                      - origins:submerged_in
                      - origins:swimming
                      - origins:tamed
                      - origins:time_of_day
                      - origins:using_effective_tool
                      - origins:using_item
                      - origins:xp
                      - $DEPRECATED
                      - origins:and
                      - origins:or
                      - origins:chance
                      - origins:xp_levels
                      - origins:xp_points
                      
                    more:
                        string-origins:all_of:
                            conditions:
                                desc: All of these conditions have to be fulfilled in order for this condition to be fulfilled.
                                type: list
                                vals:
                                    link: entity_condition
                        string-origins:and:
                            conditions:
                                desc: (DEPRECATED) All of these conditions have to be fulfilled in order for this condition to be fulfilled.
                                type: list
                                vals:
                                    link: entity_condition
                        string-origins:any_of:
                            conditions:
                                desc: At least one of these conditions have to be fulfilled in order for this condition to be fulfilled.
                                type: list
                                vals:
                                    link: entity_condition
                        string-origins:or:
                            conditions:
                                desc: (DEPRECATED) At least one of these conditions have to be fulfilled in order for this condition to be fulfilled.
                                type: list
                                vals:
                                    link: entity_condition
                        string-origins:random_chance:
                            link: meta_condition_chance
                        string-origins:chance:
                            link: meta_condition_chance
                        string-origins:constant:
                            link: meta_condition_constant
                        string-origins:ability:
                            ability:
                                desc: The namespace and ID of the ability to check for.
                                link: player_abilities
                        string-origins:advancement:
                            advancement:
                                desc: 	The namespace and ID of the advancement the player needs to have completed in order for this condition to evaluate to true.
                                link: identifier
                        string-origins:air:
                            comparison:
                                desc: How the breath / air / bubble bar (in ticks) should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value to compare to.
                                type: integer
                        string-origins:attached_to_rope:
                            slot:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/air
                                desc: Only count ropes with this label. If omitted, all ropes the entity is an end of are counted.
                                type: string
                            comparison:
                                desc: How the rope count is compared against compare_to.
                                link: comparison
                            compare_to:
                                desc: The number the rope count is compared against.
                                type: integer
                                default: 1
                        string-origins:attack_charge:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/attack_charge
                                desc: How the charge is compared to compare_to.
                                link: comparison
                            compare_to:
                                desc: The charge to compare against, from 0.0 (just swung) to 1.0 (fully recharged).
                                link: expression_float
                        string-origins:attribute:
                            attribute:
                                desc: |
                                    ID of the attribute of which the value should be checked. See Minecraft Wiki: Attribute (Attributes) for a list of vanilla attributes that can be checked for.
                                href: https://minecraft.wiki/w/Attribute
                                link: identifier
                            comparison:
                                desc: Determines how the attribute’s total value should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the attribute’s total value will be compared to.
                                type: number
                        string-origins:biome:
                            biome:
                                desc: If specified, only evaluate the condition to true if the biome the entity is in matches the specified namespace and ID.
                                href: https://minecraft.wiki/w/Biome#Biome_IDs
                                link: identifier
                            biomes:
                                desc: If specified, only evaluate the condition to true if the biome the entity is in matches one of the specified namespace and IDs.
                                href: https://minecraft.wiki/w/Biome#Biome_IDs
                                type: list
                                vals:
                                    link: identifier
                            condition:
                                desc: If specified, only evaluate the condition to true if the biome the entity is in fulfills the specified biome condition type.
                                link: biome_condition
                        string-origins:block_collision:
                            block_condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/block_collision
                                desc: If specified, the condition type will only evaluate to true if the bounding box of the entity is colliding with a block that fulfills this condition.
                                link: block_condition
                            offset_x:
                                desc: |
                                    By how much of the bounding box size should the box be offset in the X direction (e.g.: 0 = no offset, 1 = offset of exact width, 2 = offset of twice the width of the bounding box)
                                type: number
                                default: 0
                            offset_y:
                                desc: |
                                    By how much of the bounding box size should the box be offset in the Y direction (e.g.: 0 = no offset, 1 = offset of exact width, 2 = offset of twice the width of the bounding box)
                                type: number
                                default: 0
                            offset_z:
                                desc: |
                                    By how much of the bounding box size should the box be offset in the Z direction (e.g.: 0 = no offset, 1 = offset of exact width, 2 = offset of twice the width of the bounding box)
                                type: number
                                default: 0
                        string-origins:block_in_radius:
                            block_condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/block_in_radius
                                desc: The block condition type to check for.
                                link: block_condition
                            radius:
                                desc: The radius of the area to check how many blocks fulfill the block_condition.
                                type: integer
                            shape:
                                link: shape
                            comparison:
                                desc: Determines how the amount of blocks which fulfill block_condition block condition should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the amount of blocks which fulfill block_condition will be compared to.
                                type: integer
                                default: 1
                        string-origins:brightness:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/brightness
                                desc: Determines how the calculated brightness value should be compared to the specified value. See the doc for more information.
                                link: comparison
                            compare_to:
                                desc: The value at which the calculated brightness value will be compared to.
                                type: number
                        string-origins:climbing: {}
                        string-origins:collided_horizontally: {}
                        string-origins:command:
                            command:
                                desc: The command to execute.
                                type: string
                                ext: true
                            comparison:
                                desc: Determines how the result value (an integer) of the executed command should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the result value (an integer) of the executed command will be compared to.
                                type: integer
                                default: 1
                        string-origins:creative_flying: {}
                        string-origins:daytime: {}
                        string-origins:dimension:
                            dimension:
                                desc: The namespace and ID of the dimension the player needs to be in for this condition to evaluate to true.
                                or:
                                  - title: vanilla
                                    enum: ['overworld','nether','the_end']
                                  - title: custom
                                    link: identifier
                        string-origins:disguised: {}
                        string-origins:distance_from_coordinates:
                            reference:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/distance_from_coordinates
                                desc: The point to compare the distance to.
                                enum: [world_origin, world_spawn]
                            offset:
                                desc: If specified, determines how much the reference point should be offset.
                                link: vector
                            ignore_x:
                                desc: Determines whether to consider the X axis to be 0.
                                type: boolean
                            ignore_y:
                                desc: Determines whether to consider the Y axis to be 0.
                                type: boolean
                            ignore_z:
                                desc: Determines whether to consider the Z axis to be 0.
                                type: boolean
                            shape:
                                link: shape
                            scale_reference_to_dimension:
                                desc: Determines whether to check for the reference point whilst considering the coordinate scale of the dimension.
                                type: boolean
                                default: true
                            result_on_the_wrong_dimension:
                                desc: If specified, this value will override the result of the comparison if the block being tested is not in the reference's dimension.
                                type: boolean
                            round_to_digit:
                                desc: |
                                    If specified, rounds the result to the closest number with the specified amount of digits after the comma. Negative numbers also work (e.g: -2 rounds to multiples of 100).
                                type: integer
                            comparison:
                                desc: Determines how the calculated distance is compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the calculated distance is compared to.
                                type: number
                        string-origins:elytra_flight_possible:
                            check_state:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/elytra_flight_possible
                                desc: If set to true, the entity condition type will check if pressing the key.jump keybind would activate elytra flight if the player had the ability to.
                                type: boolean
                                default: false
                            check_abilities:
                                desc: |
                                    If set to true, the entity condition type will check whether the player has the ability to activate elytra flight. (e.g: wearing an elytra or have a power that uses the apoli:elytra_flight)
                                type: boolean
                                default: true
                        string-origins:enchantment:
                            enchantment:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/enchantment
                                desc: The namespace and ID of the enchantment of interest.
                                link: identifier
                            calculation:
                                desc: Which number to compare - either the sum of levels of this enchantment on all of the player’s equipment, or the max level of this enchantment on any of the player’s equipment.
                                enum: [sum, max]
                            comparison:
                                desc: Determines how the level of the specified enchantment should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the level of the specified enchantment will be compared to.
                                type: integer
                        string-origins:entity_group:
                            group:
                                desc: Entity group required for the entity to pass the check.
                                href: https://minecraft.wiki/w/Mob#Classification
                                enum: [default, undead, arthropod, illager, aquatic]
                        string-origins:entity_in_radius:
                            bientity_condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/entity_in_radius
                                desc: Optional condition to filter counted entities (actor = the entity this condition runs on, target = each nearby entity).
                                link: bientity_condition
                            shape:
                                desc: Determines the shape of the area used for checking entities.
                                link: shape
                            radius:
                                desc: Radius/distance for detection, in blocks.
                                type: number
                                required: true
                            comparison:
                                desc: How to compare the count.
                                link: comparison
                            compare_to:
                                desc: The value to compare the count against.
                                type: integer
                                default: 1
                        string-origins:entity_set_size:
                            set:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/entity_set_size
                                desc: The Entity Set power to check
                                link: identifier
                            comparison:
                                desc: How to compare the size
                                link: comparison
                            compare_to:
                                desc: Value to compare against
                                type: integer
                        string-origins:entity_type:
                            entity_type:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/entity_type
                                desc: The entity type the entity needs to have. Prefix with \# to match an entity type tag instead.
                                link: identifier
                        string-origins:equipped_item:
                            equipment_slot:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/equipped_item
                                desc: Determines which equipment slot to check for the item.
                                link: equipment_slot
                            item_condition:
                                desc: The item condition type to check for on the item in the specified equipment slot.
                                link: item_condition
                        string-origins:exists: {}
                        string-origins:exposed_to_sky: {}
                        string-origins:exposed_to_sun: {}
                        string-origins:fall_distance:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/fall_distance
                                desc: Determines how the fall distance of the entity should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the fall distance of the entity will be compared to.
                                type: number
                        string-origins:fall_flying: {}
                        string-origins:fluid_height:
                            fluid:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/fluid_height
                                desc: |
                                    ID of the fluid tag of which the height should be checked.
                                link: identifier
                            comparison:
                                desc: Determines how the height of the fluid should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the height of the fluid will be compared to.
                                type: number
                        string-origins:food_level:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/food_level
                                desc: Determines how the food level of the player should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the food level of the player will be compared to.
                                type: number
                        string-origins:gamemode:
                            gamemode:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/gamemode
                                desc: Name of the gamemode the player should have in order for this condition to evaluate to true.
                                enum: ['survival', 'creative', 'adventure', 'spectator']
                        string-origins:glowing: {}
                        string-origins:health:
                            comparison:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/health
                                desc: Determines how the current health of the entity should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the current health of the entity will be compared to.
                                type: number
                        string-origins:hunger:
                            kind:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/hunger
                                desc: Unknown
                                type: identifier
                            comparison:
                                desc: Unknown
                                link: comparison
                            compare_to:
                                desc: Unknown
                                type: number
                        string-origins:in_block:
                            block_condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/in_block
                                desc: The block condition type to check for on the block that is overlapping with the entity’s feet.
                                link: block_condition
                        string-origins:in_block_anywhere:
                            block_condition:
                                desc: The block condition type which blocks need to fulfill in order to count for this condition.
                                link: block_condition
                            comparison:
                                desc: Determines how the amount of blocks which overlap and fulfill block_condition should be compared to the specified value.
                                link: comparison
                            compare_to:
                                desc: The value at which the amount of blocks which overlap and fulfill block_condition will be compared to.
                                type: integer
                                default: 1
                        string-origins:in_rain: {}
                        string-origins:in_snow: {}
                        string-origins:in_tag:
                            tag:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/in_tag
                                desc: The namespace and ID of the entity type tag the entity type needs to be in to pass the check.
                                link: identifier
                        string-origins:in_team:
                            team:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/in_team
                                desc: A team to match against.
                                link: team
                            teams:
                                desc: Several teams; the condition passes if any of them match.
                                type: list
                                vals:
                                    link: team
                        string-origins:in_thunderstorm: {}
                        string-origins:inventory:
                            inventory_types:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/inventory
                                desc: Determines whether to check for items in the entity’s inventory, inventories of powers present in the entity, or both.
                                type: list
                                vals:
                                    link: inventory_type
                            process_mode:
                                link: process_mode
                            item_condition:
                                desc: If specified, only account for items from the specified inventory/inventories that fulfill this condition.
                                link: item_condition
                            slots:
                                desc: If specified, only items from these specified item slots are evaluated.
                                link: slots
                            slot:
                                desc: If specified, only the item from this specified item slot is evaluated.
                                link: slot
                            power:
                                desc: If specified and if inventory_types includes "power", the items in the inventory of only this power specifically will be evaluated.
                                link: identifier
                            comparison:
                                desc: Determines how the amount of items/stacks that were evaluated are compared to the specified value.
                                link: comparison
                                default: '>'
                            compare_to:
                                desc: The value at which the amount of items/stacks that were evaluated are compared to.
                                type: integer
                                default: 0
                        string-origins:invisible: {}
                        string-origins:key_pressed:
                            key:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/key_pressed
                                link: key
                        string-origins:living: {}
                        string-origins:moving:
                            horizontally:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/moving
                                desc: Determines whether to check if the entity is moving horizontally.
                                type: boolean
                                default: true
                            vertically:
                                desc: Determines whether to check if the entity is moving vertically.
                                type: boolean
                                default: true
                        string-origins:nbt:
                            nbt:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/nbt
                                desc: The NBT data to check for
                                type: string
                                ext: true
                        string-origins:on_block:
                            block_condition:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-conditions/on_block
                                desc: If specified, the condition will evaluate to true if the block underneath the entity’s feet fulfills the specified block condition type. Otherwise, only check if the entity is on the ground.
                                link: block_condition
                        string-origins:on_fire: {}
                        string-origins:origin:
                            origin:
                                desc: The origin(s) to look for. Passes if any of them matches. Wildcard matching is supported.
