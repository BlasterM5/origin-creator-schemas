                    string-origins:climbing:
                        allow_holding:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/climbing/
                            desc: If true, the entity that has the power is able to hold onto blocks.
                            type: boolean
                            unspec: true
                        hold_condition:
                            desc: If specified and allow_holding is true, the entity that has the power will be able to ‘hold onto the block’ (not affected by gravity) if this condition is fulfilled, otherwise, defaults to if the entity is sneaking.
                            link: entity_condition
                    string-origins:cooldown:
                        cooldown:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/cooldown/
                            desc: The number of ticks the cooldown needs to recharge from 0 back to cooldown. Becomes the resource’s max.
                            link: expression_integer
                        hud_render:
                            desc: Determines how the cooldown is visualized on the HUD.
                            link: hud_render
                        persistent:
                            desc: When true, the cooldown’s remaining ticks survive server restart (so a player who used their ult and logged off doesn’t get to reuse it on login). When false, the cooldown resets to ready (value 0) whenever the entity rejoins the world.
                            type: boolean
                            unspec: true
                    string-origins:creative_flight: {}
                    string-origins:custom_model_render:
                        or:
                          - title: 'Geometry Mode'
                            mode:
                                const: 'geometry'
                            model_location:
                                href: https://0vergrown.github.io/Handbook/docs/datapack/powers/custom_model_render/
                                desc: |
                                    The Blockbench model. mymod:cape resolves to assets/mymod/geo/cape.geo.json (the standard Blockbench/GeckoLib folder) — assets/mymod/models/apoli/cape.geo.json also works. Export from Blockbench as Bedrock geometry (.geo.json).
                                link: identifier
                                required: true
                            texture_location:
                                desc: The texture that UV-maps onto the model, e.g. mymod:textures/entity/cape.png.
                                link: identifier
                                required: true
                            render_as_overlay:
                                desc: Minions only! false replaces the minion’s own model with yours; true draws yours on top of it. Ignored on players, where geometry is always drawn over the player model.
                                type: boolean
                            animations:
                                desc: Bedrock animations to play on the model. The first entry whose condition passes is the one that plays.
                                or:
                                  - title: 'single'
                                    link: model_animation
                                  - title: 'multiple'
                                    type: list
                                    vals:
                                        link: model_animation
                          - title: 'Texture Mode'
                            mode:
                                const: 'texture'
                            wide_texture_location:
                                href: https://0vergrown.github.io/Sync-Documentation-Website/index.html?file=power_types%2Fentity_texture_overlay.md
                                desc: Texture for the wide (Steve) model.
                                link: identifier
                                required: true
                            slim_texture_location:
                                desc: Texture for the slim (Alex) model.
                                link: identifier
                            render_as_overlay:
                                desc: false replaces the skin; true draws the texture as an overlay layer honouring render_type, body_parts and the tint.
                                type: boolean
                            hide_cape:
                                desc: Hide the holder’s cape while active.
                                type: boolean
                        render_type:
                            link: render_type
                        body_parts:
                            desc: |
                                In texture mode, restrict an overlay to these parts: head, hat, body, right_arm, left_arm, right_leg, left_leg on a player, main, flat2, flat3 on a minion. In geometry mode, render only the bones with these names — any bone name in your own model, not just the vanilla ones. Every bone you do not name is hidden, and hiding a bone hides everything nested under it.
                            or:
                              - title: 'Player - All/Single Part'
                                link: body_part
                              - title: 'Player - Multiple Parts'
                                type: list
                                vals:
                                    link: body_part
                              - title: 'Minion - All/Single Part'
                                enum: ['main','flat2','flat3']
                                unspec: true
                              - title: 'Minion - Multiple Parts'
                                type: list
                                vals:
                                    enum: ['main','flat2','flat3']
                        red:
                            desc: Red color channel multiplier (0.0-1.0).
                            type: number
                            default: 1.0
                            min: 0.0
                            max: 1.0
                        green:
                            desc: Green color channel multiplier (0.0-1.0).
                            type: number
                            default: 1.0
                            min: 0.0
                            max: 1.0
                        blue:
                            desc: Blue color channel multiplier (0.0-1.0).
                            type: number
                            default: 1.0
                            min: 0.0
                            max: 1.0
                        alpha:
                            desc: Alpha/transparency (0.0-1.0).
                            type: number
                            default: 1.0
                            min: 0.0
                            max: 1.0
                        scale:
                            desc: Scales the drawn geometry outward from the model origin (aura/shell effect above 1.0).
                            type: number
                            default: 1.0
                        hidden_slots:
                            desc: Hide this render whenever any listed slot is occupied — e.g. ["head"] hides a custom hat model when a real helmet is worn.
                            type: list
                            vals:
                                link: equipment_slot
                        show_first_person:
                            desc: Also draw on the holder’s own arm in first person. In texture mode that is the overlay texture; in geometry mode it is the model’s right_arm / left_arm bones (and everything nested under them), posed onto the vanilla first-person arm.
                            type: boolean
                    string-origins:damage_over_time:
