        props:
            operation:
                link: attribute_modifier_operation
            name:
                desc: The vanilla AttributeModifier name (used for the modifier’s UUID seed).
                link: meta_key
                default: unspec
            resource:
                desc: If set, use the value of this Resource (or Cooldown) power as the modifier value instead of value/value-as-Expression.
                link: identifier
                default: unspec
            value:
                desc: The modifier value. Also accepts the alias amount. When an Expression, evaluated each time the modifier is applied.
                link: expression_float
            modifier:
                link: attribute_modifier_legacy
    attribute_modifier_operation:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/attribute-modifier-operation
        enum: ['add_base_early','addition','multiply_base_additive','multiply_base','multiply_base_multiplicative','standard_multiply_base','standard_divide_base','add_base_late','min_base','max_base','set_base','multiply_total_additive','multiply_total_multiplicative','multiply_total','standard_multiply_total','standard_divide_total','min_total','max_total','set_total']
        desc: |
            The operation performed by this modifier. The following operations are available:
            add_base_early:					NewBase = Base + Modifier (early in the base phase)
            /addition
            multiply_base_additive:			NewBase = Base + (Base * Modifier)
            /multiply_base
            multiply_base_multiplicative:	NewBase = Base * (1 + Modifier)
            standard_multiply_base:			NewBase = Base * Modifier
            standard_divide_base:			NewBase = Base / Modifier
            add_base_late:					NewBase = Base + Modifier (late in the base phase)
            min_base:						NewBase = max(Base, Modifier) (raise the floor)
            max_base:						NewBase = min(Base, Modifier) (lower the ceiling)
            set_base:						NewBase = Modifier
            multiply_total_additive:		NewTotal = Total * (Total * Modifier)
            multiply_total_multiplicative:	NewTotal = Total * (1 + Modifier)
            /multiply_total
            standard_multiply_total:		NewTotal = Total * Multiplier
            standard_divide_total:			NewTotal = Total / Multiplier
            min_total:						NewTotal = max(Total, Modifier)
            max_total:						NewTotal = min(Total, Modifier)
            set_total:						NewTotal = Modifier (last, overrides everything)
