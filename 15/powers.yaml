                            desc: Determines whether the player is be able to harvest the block.
                            type: boolean
                        stack:
                            desc: Roll the block’s loot table as if the player had been holding this item, exactly like the tool argument of /loot … mine <pos> <tool>. The player’s real tool still takes the durability damage and still decides how fast the block breaks; only the drops are computed from stack.
                            link: item_stack
                    string-origins:modify_healing:
