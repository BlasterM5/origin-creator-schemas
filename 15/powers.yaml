                    string-origins:ignore_water:
                        fluid_condition:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/ignore_fluid/
                            desc: (DEPRECATED) The fluid condition type to check the fluid state at the position.
                            link: fluid_condition
                    string-origins:inventory:
                        title:
