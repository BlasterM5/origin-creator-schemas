    projectile_type_enum:
        enum: ['no_type','fireball','small_fireball','dragon_fireball','firework_rocket','llama_spit','arrow','spectral_arrow','shulker_bullet','experience_bottle','egg','ender_pearl','eye_of_ender','snowball','splash_potion','lingering_potion','trident','wind_charge','breeze_wind_charge','wither_skull']
        unspec: 'no_type'
    radial_menu_entry:
        type: object
        props:
            condition:
                desc: Checked when the menu opens. A slice whose condition fails is left out of the menu entirely, so the remaining slices close up around it.
                link: entity_condition
            entity_action:
                desc: What picking this slice does.
                link: entity_action
                required: true
            item:
                desc: An item drawn as the slice’s icon.
                link: item_stack
            icon:
                desc: A texture drawn as the icon instead of an item.
                link: identifier
            highlight_icon_texture:
                desc: Icon used while the slice is hovered.
                link: identifier
            button_texture:
                desc: The slice’s background.
                link: identifier
            highlight_button_texture:
                desc: Background while hovered.
                link: identifier
            tooltip:
                desc: Text shown while hovered.
                link: text_component
            distance:
                desc: How far from the centre the slice sits, in pixels. -1 uses the default.
                type: integer
                min: -1
                default: -1
            velocity:
                desc: How quickly the slice animates outward. -1 uses the default.
                type: integer
                min: -1
                default: -1
            button_width:
                desc: Slice width in pixels.
                type: integer
                min: 1
                default: 16
            button_height:
                desc: Slice height in pixels.
                type: integer
                min: 1
                default: 20
            icon_width:
                desc: Icon width in pixels.
                type: integer
                min: 1
                default: 16
            icon_height:
                desc: Icon height in pixels.
                type: integer
                min: 1
                default: 16
            item_width:
                desc: Item icon width.
                type: integer
                min: 1
                default: 16
            item_height:
                desc: Item icon height.
                type: integer
                min: 1
                default: 16
    raycast_action:
        type: object
        props:
            distance:
                href: https://0vergrown.github.io/Handbook/docs/datapack/entity-actions/raycast
                desc: Maximum range for both block and entity raycasting. Defaults to the entity’s effective reach.
                type: number
                default: unspec
            block:
                desc: Whether the ray can hit blocks
                type: boolean
                default: true
            entity:
                desc: Whether the ray can hit entities
                type: boolean
                default: true
            shape_type:
                link: shape_type
            fluid_handling:
                link: fluid_handling
            space:
                link: space
            direction:
                desc: Custom ray direction. If omitted, uses the entity’s current look direction
                link: vector
            pierce:
                desc: Shorthand that sets both pierce_blocks and pierce_entities.
                type: boolean
            pierce_blocks:
                desc: |
                    If true, the ray passes through blocks: block_action runs on every block the ray intersects (up to 128), blocks stop culling entities behind them, and the ray traces its full length.
                type: boolean
            pierce_entities:
                desc: |
                    If true, the ray passes through entities: bientity_action runs on every entity along the ray instead of only the nearest.
                type: boolean
            particle:
                desc: Particle to spawn at intervals along the ray
                link: particle_effect
            spacing:
                desc: Distance in blocks between each particle spawn along the ray
                type: float
                default: 0.5
            entity_distance:
                desc: Maximum range for entity detection only. Overrides distance for entities
                type: number
                default: unspec
            block_distance:
                desc: Maximum range for block detection only. Overrides distance for blocks
                type: number
                default: unspec
            radius:
                desc: |
                    Thickens the ray into a beam for entity detection — a single number (uniform) or a vector { "x": .., "y": .., "z": .. } (width / height / depth). Entities within this half-extent of the ray line are hit. Block detection still uses the centre line.
                link: vector_or_number
            cone_angle:
                desc: Turns entity detection into a directional cone attack — hits every entity within this many degrees of the ray direction, out to the entity range. Takes the place of radius for entities; block detection still follows the centre line.
                type: number
                default: unspec
                gap: true
            bientity_condition:
                desc: If specified, only entities passing this condition (actor = source, target = candidate) are considered valid hits
                link: bientity_condition
            block_condition:
                desc: If specified, block_action only runs when the hit block satisfies this condition
                link: block_condition
            bientity_action:
                desc: Action executed on each entity hit (actor = source, target = hit entity)
                link: bientity_action
            block_action:
                desc: Action executed on the block hit by the ray
                link: block_action
                gap: true
            before_action:
                desc: Action executed on the source entity before the ray is cast
                link: entity_action
            hit_action:
                desc: Action executed on the source entity when the ray hits anything
                link: entity_action
            miss_action:
                desc: Action executed on the source entity when the ray hits nothing
                link: entity_action
                gap: true
            command_at_hit:
                desc: Command to run at the hit position — the nearest hit, whether that is a block or an entity. Not run on a miss.
                type: string
                ext: true
            command_hit_offset:
                desc: Distance in blocks to push the command_at_hit position back out of what was hit — along the block face normal for a block hit, back along the ray for an entity hit
                type: number
                default: 0
            command_along_ray:
                desc: Command to run repeatedly at intervals along the ray
                type: string
                ext: true
            command_step:
                desc: Interval in blocks between each execution of command_along_ray
                type: number
                default: 1
            command_along_ray_only_on_hit:
                desc: If true, command_along_ray only runs when the ray hits something
                type: boolean
            chain:
                desc: Another raycast fired from this ray’s end point (its hit position, or the max-range point on a miss). Lets rays bounce and branch for visual effects. Nests recursively — a chain may itself have a chain.
                link: raycast_action
            chain_direction:
                desc: |
                    For a chained ray only — how the child ray is aimed: forward (continue in the same direction), reflect (bounce off the hit block’s surface), or custom (use the child’s own direction/space).
                enum: ['default','forward','reflect','custom']
                unspec: 'default'
    render_type:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/render-type
        desc: |
            Selects how a texture is drawn onto the model — the blend/cull/lighting style of a render layer.
            render_type			Description
            translucent			Standard semi-transparent draw (back faces culled-free, alpha blended). The default, and the classic overlay look. Honours the tint and alpha.
            translucent_cull	Like translucent but with back-face culling. Slightly cheaper; use when the texture has no see-through interior faces.
            cutout				Hard-edged: each pixel is either fully opaque or fully transparent (no partial alpha). Good for crisp re-textures and decals.
            cutout_no_cull		cutout without back-face culling, so thin/flat geometry is visible from both sides.
            solid				Fully opaque draw; the alpha channel is ignored.
            emissive			Glowing: drawn unlit (full-bright) and alpha-blended, but still tinted. Aliases: glow, translucent_emissive. Great for auras and energy effects that should shine in the dark.
            eyes				The vanilla “eyes” style — always full-bright and untinted (the tint fields are ignored). Classic glowing-eyes / mob-eyes look.
        enum: ['translucent','translucent_cull','cutout','cutout_no_cull','solid','emissive','eyes']
    rope_endpoint:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/rope-endpoint
        desc: Describes one end of a rope (how it is chosen at runtime) used by the from and to fields of the Attach Rope. See the doc for more information.
        type: object
        props:
            source:
                desc: |
                    Where the endpoint comes from. One of: self (the acting entity), target (the bi-entity target — only resolves when the action runs in a bi-entity context), raycast (cast a ray from the actor’s eyes), position (a fixed point).
                enum: ['self','target','raycast','position']
            distance:
                desc: For raycast - how far the ray reaches.
                type: number
                default: 30
            entities:
                desc: For raycast - whether the ray can attach to an entity it hits.
                type: boolean
            blocks:
                desc: For raycast - whether the ray can attach to a block it hits. When both entities and blocks are enabled the nearest hit wins.
                type: boolean
                unspec: true
            position:
                desc: For position - The fixed [x,y,z] world coordinate.
                type: list
                vals:
                    type: number
    rope_mode:
        desc: |
            How the length constraint behaves.
            leash	free within length, springy swinging grapple past it (the default).
            spring	a soft elastic pull past length, so the rope visibly stretches and eases back (a rubber band).
            rigid	holds a fixed distance both ways — pulled in when too far and pushed out when too close (a rod/pole).
        enum: ['leash','spring','rigid']
    script_params:
        desc: Values handed to the script. Read them with event.params from KubeJS, or params inside a data pack script. This is how one script serves several powers.
        link: nbt
    selection:
        enum: ['main','active','pool','all']
    set_iteration:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/set-iteration
        desc: |
            A String used to determine which side of an entity set is walked.
            members		Walk the set the acting entity owns. The actor is the acting entity, and each target is one member of its set. The acting entity must hold the set power, otherwise nothing happens.
            owners		Walk the sets the acting entity is in. One iteration per entity whose set power currently contains the acting entity; the actor is that owner and the target is the acting entity. The acting entity does not need to hold the set power.
        enum: ['members','owners']
    shape:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/shape
        desc: |
            The outline of a region around a centre point.
            cube	\|dx\| ≤ rx, \|dy\| ≤ ry, \|dz\| ≤ rz (a box)
            sphere	(dx/rx)² + (dy/ry)² + (dz/rz)² ≤ 1 (an ellipsoid)
            star	\|dx\|/rx + \|dy\|/ry + \|dz\|/rz ≤ 1 (a stretched octahedron)
            cone	apex at centre, opening upward to height ry; the x/z spread reaches rx/rz at the top
            Per-axis extents are rounded up to whole blocks for block-based powers.
        enum: ['cube','sphere','star','cone']
    shape_type:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/shape-type
        desc: |
            A String used to determine how raycasts will handle blocks.
            collider	The ray will only stop at blocks with collision. (e.g: blocks that cannot be walked through)
            outline		The ray will take the shape of the block into account, only stopping if the ray has hit a face of a block.
            visual		The ray will only stop at blocks that are not considered transparent. (e.g: blocks that aren’t see-through)
        enum: ['collider','outline','visual']
    sound_category:
        desc: If specified, this specifies the category and options the sound event falls under. Otherwise, uses the category specified in the entity that invoked this action.
        enum: ['default','master','music','record','weather','block','hostile','neutral','players','ambient','voice']
        unspec: 'default'
    space:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/space
        desc: A String that defines which coordinate system is used for directions. See the doc for more information
        enum: ['world','local','local_horizontal','local_horizontal_normalized','velocity','velocity_normalized','velocity_horizontal','velocity_horizontal_normalized']
    stat:
        desc: An Object specifying a statistic via a statistic type and an Identifier.
        type: object
        props:
            type:
                desc: The type of the statistic.
                link: identifier
            id:
                desc: The name of the statistic; may depend on the specified type of the statistic.
                link: identifier
    status_effect:
        or:
          - title: built-in
            enum: ['all','absorption','unluck','bad_omen','blindness','conduit_power','darkness','dolphins_grace','fire_resistance','glowing','haste','health_boost','hero_of_the_village','hunger','infested','instant_damage','instant_health','invisibility','jump_boost','levitation','luck','mining_fatigue','nausea','night_vision','oozing','poison','raid_omen','regeneration','resistance','saturation','slowness','slow_falling','speed','strength','trial_omen','water_breathing','weakness','weaving','wind_charged','wither']
            unspec: 'all'
          - title: custom
            link: identifier
            default: unspec
    status_effect_array:
        type: list
        vals:
            link: status_effect
    status_effect_instance:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/status-effect-instance
        desc: An Object which defines a status effect with duration, amplifier, etc.
        type: object
        props:
            id:
                desc: The identifier of the status effect.
                talias: effect
                link: status_effect
            duration:
                desc: Determines the duration of the status effect in ticks.
                link: expression_integer
                default: 100
            amplifier:
                desc: Determines the strength of the status effect (0 being level 1).
                link: expression_integer
                default: 0
            ambient:
                desc: Determines whether the particle effects of the status effect is less noticeable.
                talias: is_ambient
                type: boolean
            show_particles:
                desc: Determines whether the status effect should display particle effects on the entity.
                type: boolean
                unspec: true
            show_icon:
                desc: Determines whether the status effect should display an icon on the HUD.
                type: boolean
                unspec: true
    status_effect_instance_chance:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/status-effect-instance
        desc: An Object which defines a status effect with duration, amplifier, etc.
        type: object
        props:
            id:
                desc: The identifier of the status effect.
                talias: effect
                link: status_effect
            duration:
                desc: Determines the duration of the status effect in ticks.
                link: expression_integer
                default: 100
            amplifier:
                desc: Determines the strength of the status effect (0 being level 1).
                link: expression_integer
                default: 0
            ambient:
                desc: Determines whether the particle effects of the status effect is less noticeable.
                talias: is_ambient
                type: boolean
            show_particles:
                desc: Determines whether the status effect should display particle effects on the entity.
                type: boolean
                unspec: true
            show_icon:
                desc: Determines whether the status effect should display an icon on the HUD.
                type: boolean
                unspec: true
            chance:
                desc: Chance of the status effect taking effect.
                link: number_percent
    structure:
        or:
          - title: built-in
            enum: ['any','ancient_city','bastion_remnant','buried_treasure','end_city','fortress','mansion','mineshaft','mineshaft_mesa','monument','nether_fossil','ocean_ruin_cold','ocean_ruin_warm','pillager_outpost','ruined_portal','ruined_portal_desert','ruined_portal_jungle','ruined_portal_mountain','ruined_portal_nether','ruined_portal_ocean','ruined_portal_swamp','shipwreck','shipwreck_beached','stronghold','desert_pyramid','igloo','jungle_pyramid','swamp_hut','trail_ruins','trial_chambers','village_desert','village_plains','village_savanna','village_snowy','village_taiga']
            unspec: 'any'
          - title: custom
            link: identifier
    team:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/team
        desc: A scoreboard team, given either by name or as a set of properties to match.
        or:
          - title: simple
            link: identifier
          - title: custom
            type: object
            props:
                name:
                    desc: The team’s name, as used by /team
                    link: identifier
                friendly_fire:
                    desc: Whether members can damage each other.
                    link: boolean_optional
    text_component:
        type: object
        props:
            text:
                desc: The text of this segment (full vanilla text component supported).
                id: item_modifiers
                link: jsontxt
            condition:
                desc: The segment only shows while this condition passes (tested on the displaying player, server side).
                type: entity_condition
    use_trigger:
        desc: |
            Defines when the action is executed.
            finish		The action will execute when the entity finishes (as in, completes) using an item which has a use duration, such as eating food.
            start		The action will execute when the entity starts using an item which has a use duration.
            stop		The action will execute when the entity stops using an item which has a use duration, before the maximum use duration has been reached. Compared to finish, this can be used to detect shooting a bow, for example.
            during		The action will be called every tick while the entity is using an item which has a use duration.
            instant		The action will not fire for items with a use duration, but will instead fire when an item is used which triggers its effect instantly, such as an ender pearl or splash potion.
        enum: ['finish', 'start', 'stop', 'during', 'instant']
    vector_or_number:
        or:
          - title: number
            type: number
          - title: vector
            link: vector
    vector:
        type: object
        props:
            x:
                type: number
            y:
                type: number
            z:
                type: number
hooks: [preserve_single]
or:
  - title: simple
    link: power
  - title: multiple
