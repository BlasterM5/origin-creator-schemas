    icon:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/icon
        desc: An item, item stack, or texture, used wherever Apoli or Origins draws a small picture.\n Texture can be a single texture atlas, with the starting corner of a 16x16 region defined in width / height.\n If width / height are unspecified, it will use the whole texture and scale it to fit.
        icon:
            or:
              - title: item
                link: identifier
              - title: stack
                link: item_stack
              - title: texture
                type: object
                props:
                    texture:
                        desc: Path to the PNG, relative to assets/<namespace>/.
                        link: identifier
                    width:
                        desc: Width in pixels of the region to draw, measured from the top-left of the file.
                        type: integer
                        default: unspec
                    height:
                        desc: Height in pixels of the region to draw, measured from the top-left of the file.
                        type: integer
                        default: unspec
    identifier:
        type: string
        allow: '*a-z0-9_#\/:.-'
        hook: [ns]
    identifier_array:
        type: list
        vals:
            link: identifier
    identifier_single_or_array:
        or:
          - title: single
            link: identifier
          - title: multiple
            link: identifier_array
    identifier_script:
        desc: |
            The script to run. Either an id registered from KubeJS with ApoliEvents, or the path of a .js file shipped in a data pack at data/<namespace>/apoli/scripts/<path>.js — in which case the .js is part of the id.
        link: identifier
        required: true
    ingredient_key:
      - nopanel: true
        link: ingredient
    ingredient:
        or:
          - title: single
            link: ingredient_select
          - title: multiple
            type: list
            vals:
                extend: ingredient_select
    ingredient_select:
        or:
          - title: simple
            link: identifier
          - title: advanced
            or:
              - title: item
                type: object
                props:
                    item:
                        desc: ID of a registered item.
                        link: identifier
              - title: tag
                type: object
                props:
                    tag:
                        desc: ID of an item tag.
                        link: identifier
    integer_amp:
        desc: The minimum and maximum amplifier of the status effect.
        type: integer
        min: 0
        max: 2147483647
    integer_dur:
        desc: The minimum and maximum duration of the status effect.
        type: integer
        min: -1
        max: 2147483647
    inventory_action_description:
        href: https://0vergrown.github.io/Handbook/docs/datapack/entity-actions/inventory_action
        desc: |
            operation	|Per-slot behaviour					|Empty slots
            modify		|Runs item_action on the stack.		|skipped
            replace		|Swaps the stack for stack,			|included
                        |then runs item_action (if any)		|
                        |on the replacement.				|
            drop		|Drops the stack into the world,	|skipped
                        |then runs item_action (if any)		|
                        |on the dropped stack first.		|
    inventory_operation:
        enum: ['modify','replace','drop']
    inventory_type:
        desc: Determines whether to reference the inventory of the entity or the inventory of the power present in the entity.
        enum: ['inventory','power']
    item_slot:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/item-slot
        desc: Represents a slot from an entity or container's inventory. Refer to the doc for more information.
        type: string
    item_stack:
        type: object
        props:
            id:
                desc: ID of a registered item.
                talias: item
                link: identifier
            count:
                desc: Size of the stack.
                talias: amount
                type: integer
                default: 1
            tag:
                link: nbt
    keybind:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/key
        desc: Defines which key an active power reacts to - a built-in key or one you define in a datapack. See the doc for more information.
        or:
          - title: simple
            link: meta_keybind
          - title: advanced
            type: object
            props:
                key:
                    desc: The keybinding’s translation key.
                    link: meta_keybind
                continuous:
                    desc: If false, the power activates once when the key is first pressed. If true, it tries to activate every tick the key is held (still respecting cooldown and conditions).
                    type: boolean
    meta_keybind:
        or:
          - title: built-in
            enum: [$Origins,'key.origins.primary_active','key.origins.secondary_active',$Apoli,'key.apoli.primary_active','key.apoli.secondary_active',$Minecraft,$Gameplay,'key.attack','key.pickItem','key.use',$Movement,'key.jump','key.sneak','key.sprint','key.left','key.right','key.back','key.forward',$Inventory,'key.drop','key.hotbar.1','key.hotbar.2','key.hotbar.3','key.hotbar.4','key.hotbar.5','key.hotbar.6','key.hotbar.7','key.hotbar.8','key.hotbar.9','key.inventory','key.swapOffhand',$Creative Mode,'key.loadToolbarActivator','key.saveToolbarActivator',$Spectator Mode,'key.spectatorOutlines','key.spectatorHotbar',$Multiplayer,'key.playerlist','key.chat','key.command','key.socialInteractions',$Miscellaneous,'key.advancements','key.quickActions','key.screenshot','key.smoothCamera','key.fullscreen','key.toggleGui','key.togglePerspective','key.toggleSpectatorShaderEffects',$Debug,'key.debug.overlay','key.debug.modifier','key.debug.clearChat','key.debug.copyRecreateCommand','key.debug.copyLocation','key.debug.spectate','key.debug.crash','key.debug.debugOptions','key.debug.dumpDynamicTextures','key.debug.dumpVersion','key.debug.switchGameMode','key.debug.reloadChunk','key.debug.reloadResourcePacks','key.debug.showAdvancedTooltips','key.debug.showChunkBorders','key.debug.showHitboxes','key.debug.profiling','key.debug.improvedTransparency','key.debug.focusPause','key.debug.profilingChart','key.debug.fpsCharts','key.debug.networkCharts']
          - title: custom
            link: meta_key
    message_filter:
        or:
          - title: simple
            type: string
          - title: advanced
            type: object
            props:
                filter:
                    desc: A regular expression tested against the message.
                    type: string
                    ext: true
                    required: true
                match_mode:
                    desc: |
                        How much of the message the pattern has to cover.
                        contains	The pattern is found anywhere in the message
                        full		The pattern covers the whole message
                        word		The pattern is found as a whole word
                        starts_with	The message begins with the pattern
                        ends_with	The message ends with the pattern
                    enum: ['contains','full','word','starts_with','ends_with']
                literal:
                    desc: |
                        Treat filter as plain text instead of a regular expression. Use this when the word contains characters like (, [ or ?.
                    type: boolean
                case_insensitive:
                    desc: |
                        Ignore letter case. Equivalent to prefixing the pattern with (?i).
                    type: boolean
                inverted:
                    desc: |
                        Turn the filter into a veto: if this pattern matches, the whole power stays inert for that message. "inverted": true makes a filter a veto. It never triggers the power on its own; it only stops the power when it matches. Use it to carve exceptions out of a broad pattern.
                    type: boolean
                before_action:
                    desc: Run before the power’s entity_action.
                    link: entity_action
                after_action:
                    desc: Run after the power’s entity_action.
                    link: entity_action
                replacement:
                    desc: Rewrite the matched text before the message is broadcast. Regex replacements work, so $1 is the first capture group.
                    type: string
                    ext: true
                prevent:
                    desc: Swallow the message — it is never sent to chat — and stop testing later filters in this power.
                    type: boolean
    meta_action_and:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-actions/and
        desc: These actions will be executed one after the other (but in the same tick).
    meta_action_random_chance:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-actions/random_chance
        desc: The chance that the action will execute, from 0 to 1. (E.g. 0.1 means 10% chance, 0.95 means 95% chance). An Expression is evaluated each attempt against the context entity.
        link: expression_float
        required: true
    meta_action_chance:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-actions/chance
        desc: (ALIAS) The chance that the action will execute, from 0 to 1. (E.g. 0.1 means 10% chance, 0.95 means 95% chance). An Expression is evaluated each attempt against the context entity.
        link: expression_float
    meta_action_choice:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-actions/choice
        desc: Executes one of the provided actions, choosing randomly based on the assigned weights. The actions with higher weight values are more likely to be chosen.
    meta_action_delay:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-actions/delay
        desc: The action which will be executed after the delay.
    meta_action_if_case:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-actions/if_case
        desc: Checks a list of actions associated with conditions, and executes every one whose condition holds. The multi-fire counterpart to apoli:if_else_list, which stops at the first match.
    meta_action_if_else:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-actions/if_else
        desc: A condition based on the type of action.
    meta_action_if_else_list:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-actions/if_else_list
        desc: Checks a list of actions associated with conditions, and executes the first one whose condition holds. A less indentation-heavy way to write a deeply nested apoli:if_else chain.
    meta_advancement_selection:
        desc: |
            Which advancements are affected: only just this one, through this one and everything leading to it, from this one and everything below it, until everything leading to it but not itself, everything all advancements.
        enum: ['only','through','from','until','everything']
    meta_condition_if_list_bientity:
        type: list
        vals:
            type: object
            props:
                condition:
                    desc: A condition to check for.
                    link: bientity_condition
                action:
                    desc: An action which might be executed.
                    link: bientity_action
    meta_condition_if_list_entity:
        type: list
        vals:
            type: object
            props:
                condition:
                    desc: A condition to check for.
                    link: entity_condition
                action:
                    desc: An action which might be executed.
                    link: entity_action
    meta_condition_random_chance:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-conditions/random_chance
        desc: Probability of passing, 0.0 to 1.0.
        link: number_percent
        required: true
    meta_condition_chance:
        href: https://0vergrown.github.io/Handbook/docs/datapack/meta-conditions/chance
        desc: (ALIAS) Probability of passing, 0.0 to 1.0.
        link: number_percent
    meta_condition_constant:
        desc: If true, the condition is always fulfilled. If false, the condition is never fulfilled.
        type: boolean
    meta_key:
        type: string
        allow: 'a-z0-9._-'
    meta_key_value:
        type: string
        allowkey: '*a-z0-9_#\/:.-'
        allow: '*a-z0-9_#\/:.-'
    meta_key_value_regex:
        type: string
        allowkey: '*a-z0-9_#\/:.\[\]\(\)\{\}$^?+\|-'
        allow: '*a-z0-9_#\/:.-'
    meta_send_condition_action:
        desc: The id of a power on the same entity. Nothing happens if the entity does not have it, if it is suppressed, if its own condition fails, or if it is not the right receiving type.
        link: identifier
        required: true
    mob_type:
        or:
          - title: built-in
            link: mob_type_enum
          - title: custom
            link: identifier
    mob_type_enum:
        enum: ['no_type',$Passive,'allay','armadillo','axolotl','bat','camel','cat','chicken','cod','cow','donkey','frog','glow_squid','horse','mooshroom','mule','ocelot','parrot','pig','rabbit','salmon','sheep','skeleton_horse','sniffer','snow_golem','squid','strider','tadpole','tropical_fish','turtle','villager','wandering_trader','zombie_horse',$Neutral,'bee','cave_spider','dolphin','drowned','enderman','fox','goat','iron_golem','llama','panda','piglin','polar_bear','pufferfish','spider','trader_llama','wolf','zombified_piglin',$Hostile,'blaze','breeze','creeper','elder_guardian','endermite','evoker','ghast','guardian','hoglin','husk','magma_cube','phantom','piglin_brute','pillager','ravager','shulker','silverfish','skeleton','slime','stray','vex','vindicator','warden','witch','wither_skeleton','zoglin','zombie','zombie_villager',$Boss,'ender_dragon','wither',$Unused,'giant','illusioner',$Stands,'armor_stand']
        unspec: 'no_type'
    model_animation:
        animation:
            href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/model-animation/
            desc: The animation file. mymod:wings resolves to assets/mymod/animations/wings.animation.json (.json also works).
            link: identifier
            required: true
        name:
            desc: Which animation inside the file to play, e.g. animation.wings.flap. A Blockbench animation file usually holds several.
            link: meta_key
        condition:
            desc: Only play this entry when the holder fulfils this condition.
            link: entity_condition
        speed:
            desc: Playback rate. 2.0 is twice as fast, 0.5 half.
            type: number
            default: 1.0
        loop:
            desc: Overrides the animation’s own loop setting. true loops forever, false plays once and stops. Blockbench’s “Hold on last frame” is honoured when this field is absent.
            link: boolean_optional
    model_part_keyframe:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/model-part-keyframe
        desc: One point on a Model Part Transformation's timeline. The value that part should have reached at a given time.
        type: object
        props:
            time:
                type: float
            value:
                type: float
            easing:
                link: easing
    model_part_transformation:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/model-part-transformation
        desc: A single edit to one named part of a biped model. See the doc for more information.
        type: object
        props:
            model_part:
                desc: The part to edit.
                link: model_parts
                required: true
            type:
                desc: The type of transformation to apply.
                enum: ['pitch','yaw','roll','x_scale','y_scale','z_scale','pivot_x','pivot_y','pivot_z','visible','hidden','xscale','yscale','zscale','pivotx','pivoty','pivotz']
            value:
                desc: The amount. Its meaning is dependent on the selected transformation type.
                type: number
            override_animation:
                desc: For pitch/yaw/roll only. If true, the value becomes the absolute rotation and the vanilla animation for that axis is ignored (“locked”). If false, it is added on top of the animation.
                type: boolean
            keyframes:
                desc: A timeline of values. When set, this replaces value and the part animates instead of holding still. The clock starts at 0 the moment the power becomes active.
                type: list
                vals:
                    link: model_part_keyframe
            loop:
                desc: If true, the keyframe timeline repeats forever. If false, it plays once and holds the last keyframe’s value.
                type: boolean
            duration:
                desc: Ticks to fade the whole transformation in when the power becomes active. 0 applies it instantly, which is the original behaviour.
                type: number
                default: 0
                min: 0
            fade_out_duration:
                desc: Ticks to fade the whole transformation in when the power becomes active. 0 applies it instantly, which is the original behaviour.
                type: number
                default: unspec
                min: 0
            easing:
                desc: The curve used for the fade in and out, and the default curve for any keyframe that does not name its own.
                link: easing
    model_parts:
        enum: ['default','head','hat','body','right_arm','left_arm','right_leg','left_leg','jacket','right_sleeve','left_sleeve','right_pants','left_pants']
        unspec: 'default'
    modify_entity_data:
        href: https://0vergrown.github.io/Handbook/docs/datapack/entity-actions/modify_entity_data
        desc: |
            Which property to change:
            data				|Type		|Property
            no_gravity			|boolean	|Whether the entity ignores gravity.
            invulnerable		|boolean	|Whether the entity is invulnerable.
            silent				|boolean	|Whether the entity makes sounds.
            glowing				|boolean	|Whether the entity has the glowing outline.
            invisible			|boolean	|Whether the entity is invisible.
            custom_name_visible	|boolean	|Whether the entity’s custom name is always shown.
            no_ai				|boolean	|Disables AI (mobs only).
            fall_distance		|number		|The accumulated fall distance.
            air					|number		|Remaining air (in ticks).
            fire_ticks			|number		|Remaining fire (in ticks).
        or:
          - title: built-in
            enum: ['no_gravity','invulnerable','silent','glowing','invisible','custom_name_visible','no_ai','fall_distance','air','fire_ticks']
          - title: custom
            link: meta_key
        value:
            desc: The new value. For a boolean property, omitting value inverts the current state. For a numeric property, omitting value does nothing.
            or:
              - title: boolean
                link: boolean_optional
              - title: number
                type: number
    nbt:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/nbt
        desc: A String or Object that defines a named binary tag (NBT) for storing arbitrary data. See the doc for more information.
        or:
          - title: simple
            type: string
            ext: true
          - title: advanced
            type: object
            extra:
                link: nbt_object
    nbt_object:
        nopanel: true
        or:
          - title: single
            type: string
            ext: true
          - title: multiple
            type: list
            vals:
                link: nbt_object
          - title: object
            type: object
            extra:
                link: nbt_object
    number_percent:
        type: number
        min: 0
        max: 1
    objective:
        type: string
        allow: 'a-zA-Z0-9_.+-'
    overlay_layer:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/overlay-layer
        desc: One render layer of an Entity Texture Overlay power — a single texture drawn over the player model with its own draw style, tint and target body parts. A power's layers field is an array of these, each independent and drawn in order on top of the base overlay.
        texture_location:
            desc: Texture used for both models. Used when a model-specific texture is not given. If omitted entirely, the layer inherits the power’s base wide/slim texture (handy for re-styling one part without repeating the texture).
            link: identifier
        wide_texture_location:
            desc: Texture used for the wide (Steve) model
            link: identifier
        slim_teture_location:
            desc: Texture used for the slim (Alex) model
            link: identifier
        render_type:
            link: render_type
        body_parts:
            desc: |
                Restrict this layer to specific model parts (e.g. "head" or ["head", "body"]). When omitted, the layer covers the whole model. Part names follow Model Color: head, hat, body, right_arm, left_arm, right_leg, left_leg (plus jacket, the sleeves and the trousers). Matching ignores case and separators.
            link: model_parts
        red:
            link: number_percent
        green:
            link: number_percent
        blue:
            link: number_percent
        alpha:
            link: number_percent
        show_first_person:
            desc: If true, this layer is also drawn on the holder’s own first-person arm (only the arm/sleeve parts are affected in first person).
            type: boolean
            unspec: true
        scale:
            desc: Scales this layer’s geometry outward from the model origin — the same idea as Sync’s Energy Swirl size. Above 1.0 puffs the texture out past the skin (an aura/shell), below 1.0 pulls it inside. 1.0 sits flush on the body.
            link: number_percent
    overlay_power_multiple:
        condition:
            desc: Per-overlay condition, inside overlays only. Checked every frame; an overlay whose condition fails is skipped while the rest keep drawing. On the single-overlay spelling the power’s own condition already does this job.
            link: entity_condition
        link: overlay_power
    overlay_power:
        texture:
            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/overlay/
            desc: The namespace and ID of the texture to use as an overlay.
            link: identifier
        strength:
            desc: |
                In texture mode, the alpha the texture is drawn at. In nausea mode, how far it is stretched (1.0 = screen size). Range 0.0–1.0.
            link: number_percent
            default: 1
        red:
            desc: |
                Multiplied into the matching colour channel. Range 0.0–1.0.
            link: number_percent
            default: 1
        green:
            desc: |
                Multiplied into the matching colour channel. Range 0.0–1.0.
            link: number_percent
            default: 1
        blue:
            desc: |
                Multiplied into the matching colour channel. Range 0.0–1.0.
            link: number_percent
            default: 1
        draw_mode:
            desc: texture draws it as-is; nausea uses the additive, stretching blend the vanilla nausea overlay uses, which treats black as transparent.
            enum: ['nausea','texture']
            default: 'texture'
            unspec: 'texture'
        draw_phase:
            desc: Determines if the overlay should render below or above the HUD ("below_hud" or "above_hud" respectively).
            enum: ['above_hud','below_hud']
            unspec: 'above hud'
        hide_with_hud:
            desc: Hide it when the HUD is hidden with F1.
            type: boolean
            unspec: true
        visible_in_third_person:
            desc: Determines if the overlay is visible in third person.
            type: boolean
        x:
            desc: Offset in GUI pixels from the anchor.
            link: expression_integer
        y:
            desc: Offset in GUI pixels from the anchor. y grows downward.
            link: expression_integer
        width:
            desc: Size of the drawn quad in GUI pixels. Leave both out for the full-screen behaviour.
            link: expression_integer
            default: unspec
        height:
            desc: Size of the drawn quad in GUI pixels. Leave both out for the full-screen behaviour.
            link: expression_integer
            default: unspec
        anchor:
            desc: Which point of the screen x/y are measured from.
            enum: ['top_left','top_center','top_right','left','center','right','bottom_left','bottom_center','bottom_right']
            unspec: 0
        u:
            desc: Top-left corner inside the texture to start drawing from — how you pick one sprite out of a sheet.
            link: expression_integer
        v:
            desc: Top-left corner inside the texture to start drawing from — how you pick one sprite out of a sheet.
            link: expression_integer
        texture_width:
            desc: The full size of the texture file. Needed whenever u/v are used, so the game knows how to map the sheet.
            type: integer
            default: unspec
        texture_height:
            desc: The full size of the texture file. Needed whenever u/v are used, so the game knows how to map the sheet.
            type: integer
            default: unspec
    part_color:
        type: object
        props:
            part:
                link: model_parts
                required: true
            red:
                desc: |
                    Red multiplier for this part. Range: 0.0 - 1.0.
                link: number_percent
                default: 1
            green:
                desc: |
                    Green multiplier for this part. Range: 0.0 - 1.0.
                link: number_percent
                default: 1
            blue:
                desc: |
                    Blue multiplier for this part. Range: 0.0 - 1.0.
                link: number_percent
                default: 1
            alpha:
                desc: |
                    Alpha multiplier for this part. Range: 0.0 - 1.0.
                link: number_percent
                default: 1
    particle_effect:
