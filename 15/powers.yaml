    process_mode:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/process-mode
        desc: A String that determines how an item stack is processed; be it either being modified or evaluated. See the doc for more information.
        enum: ['items','stacks']
    projectile_type:
        or:
          - title: built-in
            link: projectile_type_enum
          - title: custom
