                                type: number
                                default: 1.08
                            max_swing_speed:
                                desc: Cap on the sprint swing boost.
                                type: number
                                default: 0.7
                            reel_step:
                                desc: Blocks per tick the length changes while a reel key (jump/sneak) is held. This is the main “pull speed” knob for a controllable grapple — 1.0 reels in 20 blocks per second; much above ~2 feels like teleporting.
                                type: number
                                default: 0.2
                            slack_pull_rate:
                                desc: Multiplier applied to reeling in while there is slack.
                                type: number
                                default: 5.0
