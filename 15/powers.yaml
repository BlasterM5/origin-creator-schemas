                            vals:
                                link: hand
                        result_stack:
                            desc: If specified, this item stack will be given to the ’actor’ entity.
                            link: item_stack
                        bientity_action:
                            desc: The action to execute upon preventing other players from right-clicking the entity that has the power if specified.
                            link: bientity_action
                        held_item_action:
                            desc: If specified, this action will be executed on the item used by the ’actor’ entity for right-clicking the ’target’ entity.
                            link: item_action
                        result_item_action:
                            desc: If specified, this action will be executed on the item that is given to the ’actor’ entity.
