                                href: https://0vergrown.github.io/Handbook/docs/datapack/origins/transfer_origin
                                desc: steal takes the target’s origin onto the actor; give hands the actor’s origin to the target. (Determines which side is the donor and which is the recipient.)
                                enum: [steal, give]
                            copy:
