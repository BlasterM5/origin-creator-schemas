            hopper			5x1 Hopper inventory.
            dropper			3x3 Dropper inventory.
            dispenser		3x3 Dispenser inventory.
            double_chest	9x8 Double Chest inventory.
        enum: ['chest','hopper','dropper','dispenser','double_chest']
