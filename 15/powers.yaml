            allow: 'a-zA-Z0-9_.-'
    destruction_type:
        desc: |
            Determines the effect of the explosion to the terrain:
            break:		The explosion will destroy blocks and drop the loot of all of them
            none:		The explosion will *not* destroy blocks at all
            destroy:	The explosion will destroy blocks and drop the loot of *some* of them.
            			The chance to drop blocks decreases with higher explosion power.
            			It also defers to the 'minecraft:survives_explosion' loot condition in the loot tables.
        enum: ['break','none','destroy']
    easing:
        href: https://0vergrown.github.io/Handbook/docs/datapack/data-types/easing
        enum: ['linear','none','step','hold','constant','catmullrom','smooth','smoothstep','smootherstep','ease_in_sine','ease_out_sine','ease_in_out_sine','ease_in_quad','ease_in','ease_out_quad','ease_out','ease_in_out_quad','ease_in_out','ease_in_cubic','ease_out_cubic','ease_in_out_cubic','ease_in_quart','ease_out_quart','ease_in_out_quart','ease_in_quint','ease_out_quint','ease_in_out_quint','ease_in_expo','ease_out_expo','ease_in_out_expo','ease_in_circ','ease_out_circ','ease_in_out_circ','ease_in_back','ease_out_back','ease_in_out_back','ease_in_elastic','ease_out_elastic','ease_in_out_elastic','ease_in_bounce','ease_out_bounce','ease_in_out_bounce']
        desc: |
            The interpolation curve to define how a value travels from its start to its finish.
            Special Curves:
            linear			Constant rate. The default everywhere an easing is optional.
            step			No interpolation. Holds the starting value and snaps to the end value at the very end. Use this for on/off properties like visible.
            catmullrom		Smooth spline through the surrounding keyframes rather than a straight line between two of them. Only meaningful between keyframes; behaves as linear for a fade.
            smoothstep		Classic 3t² − 2t³ S-curve. Gentle ease in and out.
            smootherstep	Perlin’s 6t⁵ − 15t⁴ + 10t³. Like smoothstep but flatter at both ends.
            Standard Curves:
            Sine			ease_in_sine, ease_out_sine, ease_in_out_sine	Barely there. Good for subtle idle motion.
            Quadratic		ease_in_quad, ease_out_quad, ease_in_out_quad	The safe default for poses.
            Cubic			ease_in_cubic, ease_out_cubic, ease_in_out_cubic	Noticeably snappier.
            Quartic			ease_in_quart, ease_out_quart, ease_in_out_quart	Sharp.
            Quintic			ease_in_quint, ease_out_quint, ease_in_out_quint	Very sharp.
            Exponential		ease_in_expo, ease_out_expo, ease_in_out_expo	Near-instant at one end.
            Circular		ease_in_circ, ease_out_circ, ease_in_out_circ	Flat then abrupt, like a quarter circle.
            Back			ease_in_back, ease_out_back, ease_in_out_back	Overshoots past the target and settles back. Anticipation.
            Elastic			ease_in_elastic, ease_out_elastic, ease_in_out_elastic	Springs past the target and oscillates.
            Bounce			ease_in_bounce, ease_out_bounce, ease_in_out_bounce	Hits the target and bounces off it.
