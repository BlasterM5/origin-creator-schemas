                            href: https://minecraft.wiki/w/Commands/locate#Arguments
                            link: structure
                        spawn_strategy:
                            desc: Determines whether the player should spawn near the world spawnpoint (0, 0) of the dimension ("center") or near the coordinates of the Overworld spawnpoint (whilst considering the value of the dimension_distance_multiplier field) ("default").
                            enum: ['default', 'center']
                        dimension_distance_multiplier:
                            desc: |
                                Defines the ratio of Overworld blocks to blocks in the specified dimension. e.g: for The Nether dimension, this would be set to 0.125. This needs to be set when spawn_strategy is set to "default"
                            type: number
                            default: unspec
