                                desc: The texture the rope is drawn with.
                                link: identifier
                                default: 'apoli:textures/rope/rope.png'
                            toggle:
                                desc: When true and no slot is given, re-firing while you already hold a controllable rope releases it instead of adding another (classic one-key grapple).
                                type: boolean
                                unspec: true
                            controllable:
                                desc: Whether the built-in reel/swing keys drive this rope for its owner. Set false for tethers you cast on other entities.
                                type: boolean
