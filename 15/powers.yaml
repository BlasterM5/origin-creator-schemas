                            link: attribute_modifier_attribute
                        modifiers:
                            desc: Multiple modifiers applied to their respective attribute fields.
                            link: attribute_modifier_array_attribute
                        update_health:
                            desc: When the modifier touches minecraft:generic.max_health, scale the player’s current health so their fill ratio is preserved.
