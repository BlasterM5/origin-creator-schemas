                        entity_action:
                            href: https://0vergrown.github.io/Handbook/docs/datapack/powers/function/
                            desc: What the function does. Runs on whichever entity called it. Formatting NYI in The Origin Creator. Use Custom for your actions if parameterized for now.
                            link: entity_action
